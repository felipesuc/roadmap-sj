<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestor de Portfólio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0D1B2A; --ink-soft:#43536A; --ink-faint:#8A96A8;
  --gold:#C9A84C; --gold-soft:#F5EDD8; --gold-dark:#A5822E;
  --line:#E4E8EE; --line-soft:#F0F3F7;
  --bg:#FFFFFF; --bg-soft:#F8FAFC;
  --verde:#1B9E4B; --verde-bg:#E7F6EC;
  --amarelo:#D99000; --amarelo-bg:#FCF3DD;
  --vermelho:#D64545; --vermelho-bg:#FBE9E9;
  --azul:#2563EB; --azul-bg:#E8EFFD;
  --roxo:#7C3AED; --roxo-bg:#EDE9FE;
  --cinza:#8A96A8; --cinza-bg:#EEF1F5;
  --radius:10px;
  --shadow:0 1px 2px rgba(13,27,42,.06),0 4px 14px rgba(13,27,42,.07);
  --shadow-lg:0 8px 40px rgba(13,27,42,.18);
  font-size:15px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'IBM Plex Sans',sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:.92rem;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--gold);outline-offset:1px;border-color:var(--gold)}
textarea{resize:vertical;min-height:72px}
.mono{font-family:'IBM Plex Mono',monospace}

/* ---------- Topbar ---------- */
.topbar{position:sticky;top:0;z-index:40;background:#fff;border-bottom:1px solid var(--line)}
.topbar-inner{display:flex;align-items:center;gap:20px;padding:0 24px;height:58px}
.brand{display:flex;align-items:baseline;gap:9px;white-space:nowrap}
.brand-mark{width:11px;height:11px;background:var(--gold);border-radius:2px;transform:rotate(45deg);align-self:center}
.brand b{font-size:1.02rem;font-weight:700;letter-spacing:-.01em}
.brand span{font-size:.72rem;color:var(--ink-faint);font-family:'IBM Plex Mono',monospace;letter-spacing:.06em;text-transform:uppercase}
.tabs-strip{display:flex;gap:2px;overflow-x:auto;flex:1;scrollbar-width:thin}
.tab-btn{padding:7px 14px;border-radius:8px 8px 0 0;font-size:.88rem;font-weight:500;color:var(--ink-soft);white-space:nowrap;border-bottom:2px solid transparent;display:flex;align-items:center;gap:8px}
.tab-btn:hover{background:var(--bg-soft)}
.tab-btn.active{color:var(--ink);font-weight:600;border-bottom-color:var(--gold)}
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:8px;font-size:.86rem;font-weight:600;transition:.12s;white-space:nowrap}
.btn-primary{background:var(--ink);color:#fff}
.btn-primary:hover{background:#1c3050}
.btn-ghost{border:1px solid var(--line);color:var(--ink-soft);background:#fff}
.btn-ghost:hover{border-color:var(--ink-faint);color:var(--ink)}
.btn-gold{background:var(--gold);color:var(--ink)}
.btn-gold:hover{filter:brightness(1.05)}
.btn-danger{background:var(--vermelho);color:#fff}
.btn-sm{padding:5px 10px;font-size:.8rem}

/* ---------- Sub header ---------- */
.subbar{display:flex;align-items:center;gap:14px;padding:14px 24px;flex-wrap:wrap}
.tela-title{font-size:1.35rem;font-weight:700;letter-spacing:-.02em}
.view-switch{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-left:auto}
.view-switch button{padding:7px 16px;font-size:.84rem;font-weight:600;color:var(--ink-soft);border-right:1px solid var(--line)}
.view-switch button:last-child{border-right:none}
.view-switch button.active{background:var(--ink);color:#fff}
.subbar .actions{display:flex;gap:8px;flex-wrap:wrap}
.sync-badge{display:inline-flex;align-items:center;gap:6px;font-family:'IBM Plex Mono',monospace;font-size:.68rem;color:var(--ink-soft);border:1px solid var(--line);border-radius:12px;padding:3px 10px;white-space:nowrap}
.sync-badge i{width:7px;height:7px;border-radius:50%;background:var(--ink-faint)}
.sync-badge.ok i{background:var(--verde)}
.sync-badge.saving i{background:var(--amarelo)}
.sync-badge.err i{background:var(--vermelho)}

/* ---------- Filtros ---------- */
.filterbar{display:flex;align-items:flex-end;gap:10px;padding:0 24px 14px;flex-wrap:wrap}
.filterbar .f-field{display:flex;flex-direction:column;gap:4px}
.filterbar .f-field>span{font-family:'IBM Plex Mono',monospace;font-size:.64rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);font-weight:600}
.filterbar input,.filterbar select{width:auto;min-width:130px;padding:6px 9px;font-size:.84rem}
.filterbar input[type=search]{min-width:200px}
.filter-count{font-family:'IBM Plex Mono',monospace;font-size:.72rem;color:var(--ink-soft);background:var(--bg-soft);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
.filter-count b{color:var(--ink)}
.msel{position:relative;min-width:130px}
.msel-btn{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;min-width:130px;padding:6px 9px;font-size:.84rem;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:8px;cursor:pointer;text-align:left;white-space:nowrap}
.msel-btn .caret{font-size:.6rem;color:var(--ink-faint)}
.msel-btn .msel-n{font-family:'IBM Plex Mono',monospace;font-size:.66rem;font-weight:600;color:var(--ink);background:var(--gold-soft);border:1px solid var(--gold);border-radius:999px;padding:1px 7px}
.msel.open .msel-btn{border-color:var(--gold)}
.msel-panel{position:absolute;top:calc(100% + 4px);left:0;z-index:60;min-width:100%;max-height:240px;overflow-y:auto;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow-lg);padding:4px}
.msel-item{display:flex;align-items:center;gap:8px;padding:6px 8px;font-size:.84rem;border-radius:6px;cursor:pointer;white-space:nowrap;user-select:none}
.msel-item:hover{background:var(--bg-soft)}
.msel-item input[type=checkbox]{width:14px;height:14px;min-width:14px;accent-color:var(--gold);margin:0;padding:0;cursor:pointer}
.msel-item.checked{background:var(--gold-soft)}
.msel-clear{display:block;width:100%;text-align:left;padding:6px 8px;font-size:.76rem;color:var(--ink-faint);border-top:1px solid var(--line-soft);margin-top:3px;cursor:pointer;border-radius:6px}
.msel-clear:hover{background:var(--bg-soft);color:var(--ink)}

/* ---------- Farol pill (projeto) ---------- */
.farol-pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:20px;font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;cursor:pointer;border:1px solid transparent;white-space:nowrap}
.farol-pill .dot{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.85)}
.farol-pill.green{background:var(--verde);color:#fff}
.farol-pill.yellow{background:var(--amarelo);color:#fff}
.farol-pill.red{background:var(--vermelho);color:#fff}
.farol-pill.gray{background:var(--cinza);color:#fff}
.farol-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;display:inline-block}
.farol-dot.green{background:var(--verde)} .farol-dot.yellow{background:var(--amarelo)}
.farol-dot.red{background:var(--vermelho)} .farol-dot.gray{background:var(--cinza)}

/* ---------- Chips de status (fase/tarefa) ---------- */
.chip{font-size:.66rem;font-weight:600;padding:2px 7px;border-radius:9px;letter-spacing:.02em;white-space:nowrap}
.chip.st-not_started{background:var(--cinza-bg);color:var(--cinza)}
.chip.st-in_progress{background:var(--azul-bg);color:var(--azul)}
.chip.st-ready_to_validate{background:var(--amarelo-bg);color:var(--amarelo)}
.chip.st-validating{background:var(--roxo-bg);color:var(--roxo)}
.chip.st-done{background:var(--verde-bg);color:var(--verde)}
.chip.milestone{background:var(--gold-soft);color:var(--gold-dark)}

/* ---------- Flags ---------- */
.flag-pill{display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:10px;font-size:.66rem;font-weight:600;border:1px solid;line-height:1.3;white-space:nowrap}
.flag-pill .pill-x{cursor:pointer;margin-left:2px;font-weight:700;opacity:.55}
.flag-pill .pill-x:hover{opacity:1}
.flag-cell{display:flex;flex-wrap:wrap;gap:3px;align-items:center;min-height:20px}
.flag-add-btn{background:transparent;color:var(--ink-faint);border:1px dashed var(--line);padding:1px 6px;font-size:.68rem;border-radius:10px}
.flag-add-btn:hover{background:var(--gold-soft);border-color:var(--gold);color:var(--ink)}
.flag-popup{position:absolute;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow-lg);z-index:500;padding:6px;min-width:190px;max-width:260px;max-height:240px;overflow-y:auto}
.flag-popup .popup-option{display:flex;align-items:center;gap:6px;padding:5px 7px;border-radius:6px;cursor:pointer;font-size:.8rem}
.flag-popup .popup-option:hover{background:var(--bg-soft)}
.flag-popup .swatch{width:10px;height:10px;border-radius:50%}
.flag-popup .popup-empty{padding:8px;color:var(--ink-faint);font-size:.76rem;text-align:center}

/* ---------- Portfolio group ---------- */
.pf-block{border:1px solid var(--line);border-radius:var(--radius);margin:0 24px 16px;overflow:hidden}
.pf-head{display:flex;align-items:center;gap:10px;padding:11px 16px;background:linear-gradient(to right,var(--ink),#1c3050);color:#fff;cursor:pointer;user-select:none}
.pf-head .chev{transition:.15s;color:var(--gold)}
.pf-block.collapsed .pf-body{display:none}
.pf-block.collapsed .chev{transform:rotate(-90deg)}
.pf-head .name{font-weight:700;font-size:.98rem;flex:1}
.pf-head .count{font-family:'IBM Plex Mono',monospace;font-size:.68rem;background:rgba(255,255,255,.15);padding:2px 9px;border-radius:10px;color:var(--gold)}
.pf-head .actions{display:flex;gap:4px}
.pf-head .actions button{background:rgba(255,255,255,.12);color:#fff;padding:3px 8px;font-size:.72rem;border-radius:6px}
.pf-head .actions button:hover{background:rgba(255,255,255,.25)}
.pf-body{padding:2px 0}
.ungrouped-head{padding:9px 16px;background:var(--bg-soft);color:var(--ink-faint);font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;border-bottom:1px solid var(--line)}

/* ---------- Project row (dentro do Roadmap - tabela) ---------- */
.proj-row{border-bottom:1px solid var(--line-soft)}
.proj-row:last-child{border-bottom:none}
.proj-head{display:flex;align-items:center;gap:10px;padding:10px 16px;cursor:pointer}
.proj-head:hover{background:var(--bg-soft)}
.proj-head .toggle{color:var(--ink-faint);transition:.15s;width:16px;text-align:center}
.proj-row.expanded .toggle{transform:rotate(90deg)}
.proj-head .title{font-weight:600;flex:1}
.proj-head .sub{font-size:.72rem;color:var(--ink-faint)}
.proj-details{display:none;padding:0 16px 16px 42px;flex-direction:column;gap:10px}
.proj-row.expanded .proj-details{display:flex}
.proj-mini-progress{display:flex;align-items:center;gap:8px;min-width:170px}
.mini-bar-wrap{flex:1;height:8px;background:var(--line-soft);border-radius:4px;overflow:hidden;position:relative}
.mini-bar-pred{position:absolute;inset:0;background:var(--gold);opacity:.5}
.mini-bar-real{position:absolute;left:0;top:0;bottom:0;background:var(--ink)}
.field-row{display:grid;grid-template-columns:140px 1fr;gap:8px;align-items:start;font-size:.82rem}
.field-row label{font-weight:600;color:var(--ink-soft);padding-top:6px}
.farol-reason{border-left:3px solid var(--line);padding:8px 10px;background:var(--bg-soft);border-radius:6px}
.farol-reason.green{border-left-color:var(--verde)} .farol-reason.yellow{border-left-color:var(--amarelo)}
.farol-reason.red{border-left-color:var(--vermelho)} .farol-reason.gray{border-left-color:var(--cinza)}
.phase-list{display:flex;flex-direction:column;gap:6px}
.phase-line{display:flex;align-items:center;gap:8px;padding:6px 8px;background:#fff;border:1px solid var(--line);border-radius:8px;font-size:.82rem;flex-wrap:wrap}
.phase-line.task{margin-left:22px;background:var(--bg-soft)}
.phase-line .name{font-weight:600;flex:1;min-width:140px}
.phase-line .dates{font-family:'IBM Plex Mono',monospace;font-size:.68rem;color:var(--ink-faint)}
.phase-line .dates b{color:var(--ink-soft)}

/* ---------- Gantt / Timeline ---------- */
.timeline-wrap{margin:0 24px 24px;background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:auto;max-height:calc(100vh - 220px);cursor:grab;user-select:none}
.timeline-wrap.panning{cursor:grabbing}
.tl-year-row{display:flex;background:var(--ink);position:sticky;top:0;z-index:10;min-width:max-content}
.tl-year-row .col-info{width:280px;flex-shrink:0;border-right:1px solid #2a3d55;position:sticky;left:0;z-index:11;background:var(--ink)}
.tl-year-row .years{display:flex;min-width:3600px}
.tl-year-mark{text-align:center;padding:5px 4px;font-size:11px;font-weight:700;color:var(--gold);border-right:1px solid #2a3d55;letter-spacing:1px}
.tl-header{display:flex;background:#16233a;color:#e8edf5;border-bottom:2px solid var(--gold);position:sticky;top:27px;z-index:10;min-width:max-content;height:48px}
.tl-header .col-info{width:280px;padding:8px 14px;font-weight:600;border-right:1px solid #2a3d55;flex-shrink:0;font-size:12px;text-transform:uppercase;letter-spacing:.5px;position:sticky;left:0;z-index:11;background:#16233a}
.tl-header .col-timeline{flex:1;position:relative;min-width:3600px;display:flex;flex-direction:column}
.tl-months-row{display:flex;flex:1}
.tl-month-mark{flex:1;text-align:center;padding:5px 4px 3px;font-size:11px;font-weight:700;border-right:1px solid #2a3d55;text-transform:capitalize;white-space:nowrap;overflow:hidden}
.tl-weeks-row{display:flex;flex:1;border-top:1px solid rgba(255,255,255,.08)}
.tl-week-group{flex:1;display:flex;border-right:1px solid #2a3d55}
.tl-week-cell{flex:1;font-size:9px;font-weight:500;color:rgba(200,212,232,.8);text-align:center;padding:2px 1px;border-right:1px solid rgba(255,255,255,.06);white-space:nowrap;overflow:hidden}
.pf-tl-head{position:sticky;top:75px;z-index:9;min-width:max-content;background:linear-gradient(to right,var(--ink),#1c3050);color:#fff;padding:9px 16px;display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none;border-left:4px solid var(--gold)}
.pf-tl-head .name{font-weight:700;font-size:.95rem}
.pf-tl-head .count{font-size:.68rem;color:var(--gold);background:rgba(0,0,0,.25);padding:3px 8px;border-radius:10px;margin-left:auto;margin-right:8px}
.tl-proj-row{display:flex;border-bottom:1px solid var(--line-soft);min-height:70px;min-width:max-content}
.tl-proj-info{width:280px;flex-shrink:0;padding:9px 12px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:5px;font-size:11.5px;background:#fff;position:sticky;left:0;z-index:3;box-shadow:2px 0 4px rgba(0,0,0,.05)}
.tl-proj-name{font-weight:600;font-size:.82rem}
.tl-proj-timeline{flex:1;position:relative;min-width:3600px}
.tl-bar{position:absolute;height:22px;color:#fff;font-size:11px;padding:0 8px;border-radius:4px;display:flex;align-items:center;gap:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;border:1px solid rgba(0,0,0,.15);transition:all .15s;z-index:1}
.tl-bar:hover{z-index:10;box-shadow:0 4px 10px rgba(0,0,0,.18);filter:brightness(1.07)}
.tl-bar.st-not_started{background:var(--cinza)} .tl-bar.st-in_progress{background:var(--azul)}
.tl-bar.st-ready_to_validate{background:var(--amarelo)} .tl-bar.st-validating{background:var(--roxo)}
.tl-bar.st-done{background:var(--verde)}
.tl-bar.dev-start{border-top:3px solid var(--gold-dark)}
.tl-bar.replanned{opacity:.82}
.tl-milestone{position:absolute;top:50%;width:14px;height:14px;background:var(--gold);border:2px solid var(--ink);transform:translate(-50%,-50%) rotate(45deg);cursor:pointer;z-index:2}
.tl-milestone:hover{transform:translate(-50%,-50%) rotate(45deg) scale(1.3)}
.tl-today-line{position:absolute;top:0;bottom:0;width:0;border-left:2px dashed var(--vermelho);z-index:4;pointer-events:none}
#bar-tooltip{position:fixed;z-index:9999;background:var(--ink);color:#e8edf5;border:1px solid rgba(201,168,76,.4);border-radius:6px;padding:10px 12px;font-size:11.5px;line-height:1.5;max-width:280px;box-shadow:0 6px 20px rgba(0,0,0,.3);pointer-events:none;display:none}
#bar-tooltip .tt-title{font-weight:700;font-size:12px;color:#fff;margin-bottom:4px}
#bar-tooltip .tt-dates{color:var(--gold);font-size:10.5px;margin-bottom:6px}
.tl-legend{display:flex;gap:12px;flex-wrap:wrap;font-size:10.5px;color:var(--ink-faint);align-items:center;padding:10px 24px}
.tl-legend .item{display:flex;align-items:center;gap:5px}
.tl-legend .swatch{width:16px;height:10px;border-radius:2px;display:inline-block}
.tl-proj-resizer{position:absolute;right:0;top:0;bottom:0;width:5px;cursor:col-resize;z-index:10}
.tl-proj-resizer:hover{background:var(--gold);opacity:.6}
body.resizing{cursor:col-resize!important;user-select:none}
body.resizing *{cursor:col-resize!important}

/* ---------- Kanban ---------- */
.board-wrap{padding:0 24px 40px;overflow-x:auto}
.board{min-width:1200px}
.col-headers{display:grid;grid-template-columns:230px repeat(5,1fr);gap:12px;background:#fff;padding:8px 0 10px}
.col-h{font-family:'IBM Plex Mono',monospace;font-size:.7rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);display:flex;align-items:center;gap:8px;padding:6px 10px;border-top:3px solid var(--line);background:var(--bg-soft);border-radius:0 0 6px 6px}
.col-h .count{margin-left:auto;background:#fff;border:1px solid var(--line);border-radius:10px;padding:0 8px;font-size:.7rem;color:var(--ink-faint)}
.col-h[data-c="not_started"]{border-top-color:var(--cinza)} .col-h[data-c="in_progress"]{border-top-color:var(--azul)}
.col-h[data-c="ready_to_validate"]{border-top-color:var(--amarelo)} .col-h[data-c="validating"]{border-top-color:var(--roxo)}
.col-h[data-c="done"]{border-top-color:var(--verde)}
.raia{display:grid;grid-template-columns:230px repeat(5,1fr);gap:12px;border-top:1px solid var(--line);padding:14px 0}
.raia-label{display:flex;flex-direction:column;gap:6px;padding:4px 6px;position:relative;z-index:2;background:#fff}
.raia-name{font-weight:700;font-size:.9rem;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.raia-name::before{content:"";width:4px;height:16px;background:var(--gold);border-radius:2px}
.raia-meta{font-size:.7rem;color:var(--ink-faint);font-family:'IBM Plex Mono',monospace;display:flex;align-items:center;gap:6px}
.cell{background:var(--bg-soft);border:1px dashed transparent;border-radius:var(--radius);padding:8px;display:flex;flex-direction:column;gap:8px;min-height:70px;position:relative}
.cell.dragover{border-color:var(--gold);background:var(--gold-soft)}
.cell.scroll-limit{overflow-y:auto;scrollbar-width:thin;max-height:420px}
.cell-hidden-count{position:sticky;bottom:0;margin-top:auto;text-align:center;font-family:'IBM Plex Mono',monospace;font-size:.68rem;color:var(--ink-faint);background:linear-gradient(to bottom,transparent,var(--bg-soft) 45%);padding:10px 0 2px;pointer-events:none}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;box-shadow:var(--shadow);cursor:grab;position:relative;transition:box-shadow .12s}
.card:hover{box-shadow:var(--shadow-lg)}
.card.dragging{opacity:.45}
.card.milestone-card{border-left:3px solid var(--gold)}
.card-top{display:flex;align-items:center;gap:6px;margin-bottom:6px;flex-wrap:wrap}
.card-id{font-family:'IBM Plex Mono',monospace;font-size:.64rem;color:var(--ink-faint);font-weight:600}
.card-title{font-size:.88rem;font-weight:600;line-height:1.3;margin-bottom:4px}
.card-proj{font-size:.7rem;color:var(--ink-faint);margin-bottom:5px}
.card-dates{display:flex;gap:10px;font-family:'IBM Plex Mono',monospace;font-size:.66rem;color:var(--ink-faint);flex-wrap:wrap}
.card-dates .late{color:var(--vermelho);font-weight:700}
.card-kids{margin-top:8px;border-top:1px dashed var(--line);padding-top:7px}
.kids-bar{display:flex;align-items:center;gap:8px;font-size:.7rem;color:var(--ink-soft);cursor:pointer}
.kids-list{margin-top:6px;display:flex;flex-direction:column;gap:4px}
.kid-row{display:flex;align-items:center;gap:6px;font-size:.74rem;padding:4px 7px;background:var(--bg-soft);border-radius:6px;cursor:pointer}
.kid-row:hover{background:var(--gold-soft)}

<script>
/* ================= Utilidades ================= */
const uid = () => Math.random().toString(36).slice(2,10);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate = d => { if(!d) return '—'; const [y,m,dd] = d.split('-'); return `${dd}/${m}/${y.slice(2)}`; };
function parseDate(s){ if(!s) return null; const d = new Date(s+'T00:00:00'); return isNaN(d.getTime()) ? null : d; }
function isoWeek(d){
  const dt = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const dayNum = (dt.getUTCDay() + 6) % 7;
  dt.setUTCDate(dt.getUTCDate() - dayNum + 3);
  const firstThursday = new Date(Date.UTC(dt.getUTCFullYear(),0,4));
  const week = 1 + Math.round(((dt - firstThursday) / 86400000 - 3 + ((firstThursday.getUTCDay()+6)%7)) / 7);
  return `${dt.getUTCFullYear()}-W${String(week).padStart(2,'0')}`;
}

/* ================= Regras de negócio (100% conforme SPEC.md) ================= */
const STATUS_OPTIONS = [
  { value:'not_started',        label:'Não iniciado',         progress:0,   color:'#8A96A8' },
  { value:'in_progress',        label:'Iniciado',             progress:25,  color:'#2563EB' },
  { value:'ready_to_validate',  label:'Pronto p/ validação',  progress:50,  color:'#D99000' },
  { value:'validating',         label:'Validando',            progress:75,  color:'#7C3AED' },
  { value:'done',               label:'Pronto',                progress:100, color:'#1B9E4B' },
];
function statusToProgress(status){ const o = STATUS_OPTIONS.find(s=>s.value===status); return o ? o.progress : 0; }
function statusLabel(status){ const o = STATUS_OPTIONS.find(s=>s.value===status); return o ? o.label : status; }
function snapToSteps(pct){ pct = Math.max(0, Math.min(100, pct)); return Math.floor(pct/25)*25; }
function progressToStatus(progress){
  const snapped = snapToSteps(progress);
  const o = STATUS_OPTIONS.find(s=>s.progress===snapped);
  return o ? o.value : 'not_started';
}
function predictedByDates(item, today){
  today = today || new Date();
  const start = parseDate(item.replannedStart || item.plannedStart);
  const end = parseDate(item.replannedEnd || item.plannedEnd);
  if(!start || !end) return statusToProgress(item.status);
  if(end.getTime() <= start.getTime()) return today.getTime() >= end.getTime() ? 100 : 0;
  if(today.getTime() <= start.getTime()) return 0;
  if(today.getTime() >= end.getTime()) return 100;
  return snapToSteps((today-start)/(end-start)*100);
}
function realizedByStatus(item){ return statusToProgress(item.status); }
function phasePredictedProgress(ph, today){ return predictedByDates(ph, today); }
function phaseRealizedProgress(ph){ return realizedByStatus(ph); }
function taskPredictedProgress(t, today){ return predictedByDates(t, today); }
function taskRealizedProgress(t){ return realizedByStatus(t); }
function projectProgress(project){
  const phases = (project.phases||[]).filter(p => !p.isMilestone);
  if(!phases.length) return { predicted:0, realized:0 };
  const today = new Date();
  let sp = 0, sr = 0;
  phases.forEach(p => { sp += phasePredictedProgress(p, today); sr += phaseRealizedProgress(p); });
  return { predicted: Math.round(sp/phases.length), realized: Math.round(sr/phases.length) };
}
function isReplanned(item){ return !!(parseDate(item.replannedStart) || parseDate(item.replannedEnd)); }
function isDevStart(item){ return (item.flagIds||[]).includes('flag-dev'); }
function barDates(item){
  return {
    start: item.actualStart || item.replannedStart || item.plannedStart || '',
    end:   item.actualEnd   || item.replannedEnd   || item.plannedEnd   || ''
  };
}
function isLatePhaseOrTask(item){
  if(item.status === 'done') return false;
  const end = parseDate(item.replannedEnd || item.plannedEnd);
  if(!end) return false;
  return new Date().getTime() > end.getTime();
}
function cycleProjectStatus(projectId){
  const p = projectById(projectId);
  if(!p) return;
  const order = ['green','yellow','red'];
  const idx = order.indexOf(p.status);
  p.status = idx < 0 ? 'green' : order[(idx+1)%order.length];
  commit();
}

/* ---- TAP ---- */
const SIZE_MATRIX = {

/* ================= Seed ================= */

        status:'yellow', statusExplanation:'Integração com WhatsApp em risco por dependência externa.',

          { id:ph2, name:'Integração com WhatsApp (Mari)', isMilestone:false, flagIds:['flag-dev','flag-risk'], status:'in_progress', progress:25, plannedStart:'2026-06-27', plannedEnd:'2026-07-17', replannedStart:'', replannedEnd:'', actualStart:'', actualEnd:'', tasks:[

          { id:ph3, name:'Go-live piloto', isMilestone:true, flagIds:['flag-golive'], status:'not_started', progress:0, plannedStart:'2026-08-07', plannedEnd:'2026-08-07', replannedStart:'', replannedEnd:'', actualStart:'', actualEnd:'', tasks:[] }

/* ================= Persistência local ================= */
const STORAGE_KEY = 'portfoliosj_state_v1';
const VERSIONS_KEY = 'portfoliosj_versions_v1';
const store = {
  get(){ try{ return JSON.parse(localStorage.getItem(STORAGE_KEY)); }catch(e){ return null; } },
  set(s){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(s)); }catch(e){} }
};
let state = store.get() || seed();
if(!state.tap) state.tap = {};
if(!state.governance) state.governance = {};
if(!state.flags || !state.flags.length) state.flags = defaultFlags();

let undoStack = [];
function snapshot(){ undoStack.push(JSON.stringify(state)); if(undoStack.length>50) undoStack.shift(); }
function undo(){
  if(!undoStack.length) return;
  state = JSON.parse(undoStack.pop());
  save(); render();
}
function save(){ store.set(state); }
function commit(){ snapshot_before_last_change_noop(); save(); render(); scheduleCloud(); }
function snapshot_before_last_change_noop(){}

/* helper: chamar snapshot() ANTES de mutar o estado, então commit() depois */
function mutate(fn){ snapshot(); fn(); commit(); }

function portfolioById(id){ return state.portfolios.find(p=>p.id===id); }
function projectById(id){ return state.projects.find(p=>p.id===id); }
function findPhaseTask(id){
  for(const proj of state.projects){
    const ph = proj.phases.find(p=>p.id===id);
    if(ph) return { kind:'phase', item:ph, project:proj };
    for(const ph2 of proj.phases){
      const t = (ph2.tasks||[]).find(t=>t.id===id);
      if(t) return { kind:'task', item:t, project:proj, phase:ph2 };
    }
  }
  return null;
}
function allPhasesFlat(){ const out=[]; state.projects.forEach(p=>p.phases.forEach(ph=>out.push({ph,project:p}))); return out; }
function allTasksFlat(){ const out=[]; state.projects.forEach(p=>p.phases.forEach(ph=>(ph.tasks||[]).forEach(t=>out.push({t,phase:ph,project:p})))); return out; }

function matchProject(p){
  if(F.q){
    const q=F.q.toLowerCase();
    if(!(p.name+' '+p.company+' '+p.sponsor).toLowerCase().includes(q)) return false;
  }
  if(F.portfolio.length && !F.portfolio.includes(p.portfolioId||'__none__')) return false;
  if(F.farol.length && !F.farol.includes(p.status)) return false;
  return true;
}
function matchPhaseOrTask(item){
  if(F.status.length && !F.status.includes(item.status)) return false;
  if(F.flag.length && !(item.flagIds||[]).some(f=>F.flag.includes(f))) return false;
  return true;
}
function filteredProjects(){ return state.projects.filter(matchProject); }

/* ================= GANTT ================= */
function getTimeRange(){
  let min=null, max=null;
  allPhasesFlat().forEach(({ph})=>{
    [ph.plannedStart,ph.plannedEnd,ph.replannedStart,ph.replannedEnd,ph.actualStart,ph.actualEnd].forEach(d=>{
      const dt=parseDate(d); if(dt){ if(!min||dt<min) min=dt; if(!max||dt>max) max=dt; }
    });
  });
  const now=new Date();
  if(!min) min=now; if(!max) max=now;
  min = new Date(min.getFullYear(), min.getMonth()-1, 1);
  max = new Date(max.getFullYear(), max.getMonth()+2, 0);
  return {min,max};
}
function dateToPercent(d, range){
  const dt = typeof d==='string' ? parseDate(d) : d;
  if(!dt) return 0;
  const total = range.max - range.min;
  if(total<=0) return 0;
  return Math.max(0, Math.min(100, (dt-range.min)/total*100));
}
function monthsBetween(range){
  const out=[]; let y=range.min.getFullYear(), m=range.min.getMonth();
  while(new Date(y,m,1) <= range.max){ out.push(new Date(y,m,1)); m++; if(m>11){m=0;y++;} }
  return out;
}
function renderGantt(){
  const range = getTimeRange();
  const months = monthsBetween(range);
  const totalDays = (range.max-range.min)/86400000;
  const years = [...new Set(months.map(m=>m.getFullYear()))];
  const yearRow = years.map(y=>{
    const inYear = months.filter(m=>m.getFullYear()===y).length;
    const width = inYear/months.length*100;
    return `<div class="tl-year-mark" style="flex:0 0 ${width}%">${y}</div>`;
  }).join('');
  const monthMarks = months.map(m=>`<div class="tl-month-mark">${m.toLocaleDateString('pt-BR',{month:'short'})}</div>`).join('');
  const weekRows = months.map(m=>{
    const daysInMonth = new Date(m.getFullYear(),m.getMonth()+1,0).getDate();
    const weeks = Math.ceil(daysInMonth/7);
    return `<div class="tl-week-group">${Array.from({length:weeks}).map((_,i)=>`<div class="tl-week-cell">S${i+1}</div>`).join('')}</div>`;
  }).join('');

  const showTasks = roadmapMode==='gantt-tasks';
  const groups = groupByPortfolio(filteredProjects());
  const body = groups.map(g => `
    <div class="pf-tl-head" onclick="togglePortfolioCollapse('${g.id}')">
      <span class="chev">${collapsedPortfolios.has(g.id)?'▸':'▾'}</span>
      <span class="name">${esc(g.name)}</span>
      <span class="count">${g.projects.length} projeto(s)</span>
    </div>
    ${collapsedPortfolios.has(g.id) ? '' : g.projects.map(p=>renderGanttProjectRow(p, range, showTasks)).join('')}
  `).join('');

  return `
  <div class="timeline-wrap" id="tlWrap">
    <div class="tl-year-row"><div class="col-info"></div><div class="years">${yearRow}</div></div>
    <div class="tl-header">
      <div class="col-info">Projeto</div>
      <div class="col-timeline">
        <div class="tl-months-row">${monthMarks}</div>
        <div class="tl-weeks-row">${weekRows}</div>
      </div>
    </div>
    ${body || '<div class="dash-empty" style="padding:20px">Nenhum projeto encontrado.</div>'}
    <div class="tl-proj-resizer" style="left:280px" id="projResizer"></div>
  </div>
  <div class="tl-legend">
    ${STATUS_OPTIONS.map(s=>`<span class="item"><span class="swatch" style="background:${s.color}"></span>${s.label}</span>`).join('')}
    <span class="item"><span style="width:12px;height:12px;background:var(--gold);border:2px solid var(--ink);transform:rotate(45deg);display:inline-block"></span>Marco</span>
    <span class="item">▬ borda dourada no topo = Início Dev.</span>
    <span class="item">▬ opacidade reduzida = replanejado</span>
  </div>`;
}
function groupByPortfolio(projects){
  const groups = state.portfolios.map(pf => ({ id:pf.id, name:pf.name, projects: projects.filter(p=>p.portfolioId===pf.id) }));
  const ungrouped = projects.filter(p=>!p.portfolioId || !portfolioById(p.portfolioId));
  if(ungrouped.length) groups.push({ id:'__ungrouped__', name:'Sem Portfólio', projects: ungrouped });
  return groups.filter(g=>g.projects.length || true);
}
function togglePortfolioCollapse(id){ collapsedPortfolios.has(id)?collapsedPortfolios.delete(id):collapsedPortfolios.add(id); render(); }

function renderGanttProjectRow(p, range, showTasks){
  const prog = projectProgress(p);
  const bars = [];
  let lane = 0;
  const laneEnds = [];
  p.phases.forEach(ph=>{
    const {start,end} = barDates(ph);
    const s = parseDate(start), e = parseDate(end);
    if(ph.isMilestone){
      const left = dateToPercent(start||end, range);
      bars.push(`<div class="tl-milestone" style="left:${left}%;top:16px" title="${esc(ph.name)}" onclick="openPhaseModal('${p.id}','${ph.id}')"></div>`);
    } else if(s && e){
      let l = 0; while(laneEnds[l] && laneEnds[l] > s.getTime()) l++;
      laneEnds[l] = e.getTime();
      const left = dateToPercent(s, range), right = dateToPercent(e, range);
      const width = Math.max(right-left, 0.6);
      const cls = ['tl-bar','st-'+ph.status]; if(isDevStart(ph)) cls.push('dev-start'); if(isReplanned(ph)) cls.push('replanned');
      bars.push(`<div class="${cls.join(' ')}" style="left:${left}%;width:${width}%;top:${8+l*28}px" data-tt-name="${esc(ph.name)}" data-tt-start="${start}" data-tt-end="${end}" data-tt-real="${phaseRealizedProgress(ph)}" onclick="openPhaseModal('${p.id}','${ph.id}')">${flagIcons(ph.flagIds)}${esc(ph.name)}</div>`);
      if(showTasks) (ph.tasks||[]).forEach(t=>{
        const tb = barDates(t); const ts = parseDate(tb.start)||s, te = parseDate(tb.end)||e;
        const cs = ts<s?s:ts, ce = te>e?e:te;
        let l2=0; while(laneEnds[l2] && laneEnds[l2] > cs.getTime()) l2++;
        laneEnds[l2]=ce.getTime();
        const tleft=dateToPercent(cs,range), tright=dateToPercent(ce,range);
        const tcls=['tl-bar','st-'+t.status]; if(isDevStart(t)) tcls.push('dev-start'); if(isReplanned(t)) tcls.push('replanned');
        bars.push(`<div class="${tcls.join(' ')}" style="left:${tleft}%;width:${Math.max(tright-tleft,0.5)}%;top:${8+l2*28}px;opacity:.85" data-tt-name="${esc(t.name)}" data-tt-start="${tb.start}" data-tt-end="${tb.end}" data-tt-real="${taskRealizedProgress(t)}" onclick="openTaskModal('${p.id}','${ph.id}','${t.id}')">${esc(t.name)}</div>`);
      });
      lane = Math.max(lane, laneEnds.length);
    }
  });
  const today = new Date();
  const todayLeft = dateToPercent(today, range);
  return `<div class="tl-proj-row" style="--lanes:${Math.max(lane,1)}">
    <div class="tl-proj-info">
      <div class="tl-proj-name">${esc(p.name)}</div>
      <span class="farol-pill ${p.status}" onclick="cycleProjectStatus('${p.id}');event.stopPropagation()"><span class="dot"></span>${farolLabel(p.status)}</span>
      <div class="hint">Previsto ${prog.predicted}% · Realizado ${prog.realized}%</div>
    </div>
    <div class="tl-proj-timeline" style="min-height:${Math.max(lane,1)*28+16}px">
      ${today>=range.min && today<=range.max ? `<div class="tl-today-line" style="left:${todayLeft}%"></div>` : ''}
      ${bars.join('')}
    </div>
  </div>`;
}
function farolLabel(s){ return {green:'No prazo',yellow:'Atenção',red:'Crítico',gray:'Sem farol'}[s]||s; }
function flagIcons(ids){ return (ids||[]).map(id=>{ const f=state.flags.find(x=>x.id===id); return f?`<span class="bar-flag">${f.icon}</span>`:''; }).join(''); }

function initBarTooltip(){
  const tt = document.getElementById('bar-tooltip');
  document.querySelectorAll('.tl-bar[data-tt-name]').forEach(bar=>{
    bar.addEventListener('mouseenter', e=>{
      const {ttName,ttStart,ttEnd,ttReal} = bar.dataset;
      tt.innerHTML = `<div class="tt-title">${esc(ttName)}</div><div class="tt-dates">${fmtDate(ttStart)} → ${fmtDate(ttEnd)}</div><div>Realizado: ${ttReal}%</div>`;
      tt.style.display='block';
    });
    bar.addEventListener('mousemove', e=>{ tt.style.left=(e.clientX+14)+'px'; tt.style.top=(e.clientY+14)+'px'; });
    bar.addEventListener('mouseleave', ()=>{ tt.style.display='none'; });
  });
}
function scrollToToday(){
  const wrap = document.getElementById('tlWrap'); if(!wrap) return;
  const line = wrap.querySelector('.tl-today-line'); if(!line) return;
  requestAnimationFrame(()=>{ const left = line.parentElement.offsetLeft + parseFloat(line.style.left)/100*3600; wrap.scrollLeft = Math.max(0, left-400); });
}
/* Pan horizontal com mouse/touch */
(function setupPan(){
  document.addEventListener('mousedown', e=>{
    const wrap = e.target.closest('#tlWrap'); if(!wrap) return;
    if(e.target.closest('.tl-bar,.tl-milestone,.tl-proj-resizer')) return;
    let startX=e.clientX, startScroll=wrap.scrollLeft, moved=false, panning=false;
    function onMove(ev){
      const dx = ev.clientX-startX;
      if(!panning && Math.abs(dx)>5){ panning=true; wrap.classList.add('panning'); }
      if(panning){ wrap.scrollLeft = startScroll - dx; moved=true; }
    }
    function onUp(){ document.removeEventListener('mousemove',onMove); document.removeEventListener('mouseup',onUp); wrap.classList.remove('panning'); }
    document.addEventListener('mousemove',onMove); document.addEventListener('mouseup',onUp);
  });
})();
let projColWidth = parseInt(localStorage.getItem('portfoliosj_projcol')||'280',10);
function setupProjColResizer(){
  const resizer = document.getElementById('projResizer'); if(!resizer) return;
  document.querySelectorAll('.col-info,.tl-proj-info').forEach(el=>el.style.width=projColWidth+'px');
  resizer.style.left = projColWidth+'px';
  resizer.addEventListener('mousedown', e=>{
    e.preventDefault(); document.body.classList.add('resizing');
    function onMove(ev){
      projColWidth = Math.max(180, Math.min(520, ev.clientX));
      document.querySelectorAll('.col-info,.tl-proj-info').forEach(el=>el.style.width=projColWidth+'px');
      resizer.style.left = projColWidth+'px';
    }
    function onUp(){ document.removeEventListener('mousemove',onMove); document.removeEventListener('mouseup',onUp); document.body.classList.remove('resizing'); localStorage.setItem('portfoliosj_projcol',projColWidth); }
    document.addEventListener('mousemove',onMove); document.addEventListener('mouseup',onUp);
  });
}

/* ================= TABELA (Roadmap) ================= */
let sortKey='name', sortAsc=true;
function setSort(k){ if(sortKey===k) sortAsc=!sortAsc; else { sortKey=k; sortAsc=true; } render(); }

    </tr>

  return `<div class="table-wrap"><table class="grid">
    <thead><tr>
      <th onclick="setSort('name')">Item</th><th>Farol/Status</th><th>Flags</th>

    <tbody>${rows || `<tr><td colspan="8" class="dash-empty">Nenhum projeto.</td></tr>`}</tbody>

function renderTableProjectRows(p, showTasks){
  const prog = projectProgress(p);
  let out = `<tr class="row" onclick="openProjectModal('${p.id}')">
    <td class="td-title">${esc(p.name)}<small>${esc(p.company||'')} ${p.sponsor?'· '+esc(p.sponsor):''}</small></td>
    <td onclick="event.stopPropagation();cycleProjectStatus('${p.id}')"><span class="farol-pill ${p.status}"><span class="dot"></span>${farolLabel(p.status)}</span></td>
    <td>—</td>
    <td>${prog.predicted}% / ${prog.realized}%</td>
    <td colspan="3" class="hint">${esc(p.statusExplanation||'')}</td>
    <td onclick="event.stopPropagation()"><button class="icon-btn" title="Excluir" onclick="askDeleteProject('${p.id}')">🗑</button></td>
  </tr>`;
  p.phases.forEach(ph=>{
    out += renderTableItemRow(ph, p, 'phase', false);
    if(showTasks) (ph.tasks||[]).forEach(t=> out += renderTableItemRow(t, p, 'task', true));
  });
  return out;
}
function renderTableItemRow(item, project, kind, isTask){
  const pred = kind==='phase'?phasePredictedProgress(item):taskPredictedProgress(item);
  const real = kind==='phase'?phaseRealizedProgress(item):taskRealizedProgress(item);
  const openFn = kind==='phase' ? `openPhaseModal('${project.id}','${item.id}')` : `openTaskModal('${project.id}',findPhaseTask('${item.id}').phase.id,'${item.id}')`;
  return `<tr class="row child-row" onclick="${openFn}">
    <td class="td-title">${isTask?'↳ ':''}${esc(item.name)}${item.isMilestone?' <span class="chip milestone">MARCO</span>':''}</td>
    <td><span class="chip st-${item.status}">${statusLabel(item.status)}</span></td>
    <td>${renderFlagPills(item.flagIds)}</td>
    <td>${pred}% / ${real}%</td>
    <td class="mono">${fmtDate(item.plannedStart)}–${fmtDate(item.plannedEnd)}</td>
    <td class="mono">${item.replannedStart||item.replannedEnd?fmtDate(item.replannedStart)+'–'+fmtDate(item.replannedEnd):'—'}</td>
    <td class="mono">${item.actualStart||item.actualEnd?fmtDate(item.actualStart)+'–'+fmtDate(item.actualEnd):'—'}</td>
    <td onclick="event.stopPropagation()"><button class="icon-btn" title="Excluir" onclick="askDeleteItem('${item.id}')">🗑</button></td>
  </tr>`;
}
function renderFlagPills(ids){
  return `<div class="flag-cell">${(ids||[]).map(id=>{ const f=state.flags.find(x=>x.id===id); if(!f) return ''; return `<span class="flag-pill" style="background:${f.color}22;border-color:${f.color};color:${f.color}">${f.icon} ${esc(f.name)}</span>`; }).join('')}</div>`;
}

/* ================= KANBAN ================= */
function cardType(item, kind){ return kind; }
function renderKanban(){
  const projects = filteredProjects();
  const cards = [];
  projects.forEach(p=>p.phases.forEach(ph=>{
    if(matchPhaseOrTask(ph)) cards.push({item:ph,kind:'phase',project:p});
    (ph.tasks||[]).forEach(t=>{ if(matchPhaseOrTask(t)) cards.push({item:t,kind:'task',project:p,phase:ph}); });
  }));
  const colCount = st => cards.filter(c=>c.item.status===st).length;
  const groups = groupByPortfolio(projects);
  return `<div class="board-wrap"><div class="board">
    <div class="col-headers"><div></div>${STATUS_OPTIONS.map(s=>`<div class="col-h" data-c="${s.value}">${s.label}<span class="count">${colCount(s.value)}</span></div>`).join('')}</div>

function bindKanbanDnD(){
  document.querySelectorAll('.card').forEach(el=>{
    el.setAttribute('draggable','true');
    el.addEventListener('dragstart', e=>{ e.stopPropagation(); e.dataTransfer.setData('text/plain', el.querySelector('.card-id').textContent.replace('#','')); el.classList.add('dragging'); e.__cardFullId = null; });
  });
  // usa data attribute completo para IDs (acima é só prefixo visual) -> reconfigura via closure abaixo
  document.querySelectorAll('.card').forEach(el=>{
    el.addEventListener('dragend', ()=>el.classList.remove('dragging'));
  });
  document.querySelectorAll('.cell').forEach(cell=>{
    cell.addEventListener('dragover', e=>{ e.preventDefault(); cell.classList.add('dragover'); });
    cell.addEventListener('dragleave', ()=>cell.classList.remove('dragover'));
  });

/* Drag real: identificamos o card pelo elemento arrastado via mapeamento index->id no DOM */
document.addEventListener('dragstart', e=>{
  const card = e.target.closest && e.target.closest('.card');
  if(!card) return;
  const idx = [...card.parentElement.children].indexOf(card);
  card.dataset.dragKey = card.dataset.dragKey || uid();
  window.__draggingKanbanCard = card;
});
document.addEventListener('drop', e=>{
  const cell = e.target.closest && e.target.closest('.cell');
  const card = window.__draggingKanbanCard;
  if(!cell || !card) return;
  e.preventDefault(); cell.classList.remove('dragover');
  const cardIdPrefix = card.querySelector('.card-id').textContent.replace('#','').toLowerCase();
  const newStatus = cell.dataset.status;
  const projectId = cell.dataset.project;
  const proj = projectById(projectId); if(!proj) return;
  let target=null, isTask=false;
  proj.phases.forEach(ph=>{ if(ph.id.slice(0,4).toUpperCase()===cardIdPrefix.toUpperCase()) target=ph;
    (ph.tasks||[]).forEach(t=>{ if(t.id.slice(0,4).toUpperCase()===cardIdPrefix.toUpperCase()){ target=t; isTask=true; } });
  });
  if(!target) return;
  mutate(()=>{ target.status = newStatus; target.progress = statusToProgress(newStatus); });
  window.__draggingKanbanCard = null;
});
document.addEventListener('dragover', e=>{ if(e.target.closest && e.target.closest('.cell')) e.preventDefault(); });

/* ================= CALENDÁRIO ================= */
function calMove(delta){ let [y,m]=calRef.split('-').map(Number); m+=delta; if(m<1){m=12;y--;} if(m>12){m=1;y++;} calRef=`${y}-${String(m).padStart(2,'0')}`; render(); }
function renderCalendario(){
  const [y,m] = calRef.split('-').map(Number);
  const first = new Date(y,m-1,1);
  const startDow = first.getDay();
  const daysInMonth = new Date(y,m,0).getDate();
  const todayStr = new Date().toISOString().slice(0,10);
  const monthName = first.toLocaleDateString('pt-BR',{month:'long',year:'numeric'});
  const dows=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
  const cells=[]; const prevDays=new Date(y,m-1,0).getDate();
  for(let i=startDow-1;i>=0;i--) cells.push({d:prevDays-i,other:true});
  for(let d=1;d<=daysInMonth;d++) cells.push({d,other:false,iso:`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`});
  while(cells.length%7) cells.push({d:cells.length,other:true,pad:true});
  const items=[]; filteredProjects().forEach(p=>p.phases.forEach(ph=>{ if(matchPhaseOrTask(ph)) items.push({item:ph,project:p}); (ph.tasks||[]).forEach(t=>{ if(matchPhaseOrTask(t)) items.push({item:t,project:p}); }); }));
  const evs = iso => items.filter(x=>x.item.plannedEnd===iso || (x.item.isMilestone && x.item.plannedStart===iso));
  return `<div class="cal-wrap">
    <div class="cal-nav">
      <button class="btn btn-ghost btn-sm" onclick="calMove(-1)">←</button><h3>${monthName}</h3><button class="btn btn-ghost btn-sm" onclick="calMove(1)">→</button>
      <div class="cal-legend">${STATUS_OPTIONS.map(s=>`<span><span class="stbar" style="background:${s.color}"></span>${s.label}</span>`).join('')}</div>
    </div>
    <div class="cal-grid">
      ${dows.map(d=>`<div class="cal-dow">${d}</div>`).join('')}
      ${cells.map(c=>`<div class="cal-day ${c.other?'other':''} ${c.iso===todayStr?'today':''}"><span class="dnum">${c.d}</span>
        ${c.iso?evs(c.iso).map(x=>`<div class="cal-ev" style="border-left-color:${STATUS_OPTIONS.find(s=>s.value===x.item.status).color}" onclick="${x.item.isMilestone?`openPhaseModal('${x.project.id}','${x.item.id}')`:`openPhaseModal('${x.project.id}','${x.item.id}')`}" title="${esc(x.item.name)} — ${esc(x.project.name)}"><span>${esc(x.item.name)}</span></div>`).join(''):''}
      </div>`).join('')}
    </div>
  </div>`;
}

function govMove(delta){
  const [y,w] = govWeek.split('-W').map(Number);
  const approxDate = new Date(y,0,1+ (w-1)*7);
  approxDate.setDate(approxDate.getDate()+delta*7);
  govWeek = isoWeek(approxDate);
  render();
}
function toggleGovItem(itemId, checked){
  mutate(()=>{
    if(!state.governance[govWeek]) state.governance[govWeek]={};
    if(!state.governance[govWeek][itemId]) state.governance[govWeek][itemId]={};
    state.governance[govWeek][itemId].done = checked;
  });
}
function setGovField(itemId, field, val){
  mutate(()=>{
    if(!state.governance[govWeek]) state.governance[govWeek]={};
    if(!state.governance[govWeek][itemId]) state.governance[govWeek][itemId]={};
    state.governance[govWeek][itemId][field] = val;
  });
}

/* ---- Versões / snapshot ---- */
function loadVersions(){ try{ return JSON.parse(localStorage.getItem(VERSIONS_KEY))||[]; }catch(e){ return []; } }
function saveVersions(v){ try{ localStorage.setItem(VERSIONS_KEY, JSON.stringify(v)); }catch(e){} }
function saveVersion(){
  const versions = loadVersions();
  const now = new Date();
  versions.unshift({ id:uid(), label:now.toLocaleDateString('pt-BR',{day:'2-digit',month:'short',year:'numeric'}), time:now.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}), saved_at:now.toISOString(), snapshot:JSON.parse(JSON.stringify(state)) });
  saveVersions(versions);
  sbSaveVersion(versions[0]);
  toast('Versão salva.');
  render();
}
function renderVersionsListInline(){
  const versions = loadVersions();
  if(!versions.length) return '<div class="dash-empty">Nenhuma versão salva ainda.</div>';
  return versions.map(v=>{
    const counts = {green:0,yellow:0,red:0,gray:0};
    (v.snapshot.projects||[]).forEach(p=>counts[p.status]=(counts[p.status]||0)+1);
    return `<div class="ver-row">
      <span class="mono">${v.label} · ${v.time}</span>
      <span>🔴${counts.red||0} 🟡${counts.yellow||0} 🟢${counts.green||0}</span>
      <span><button class="icon-btn" title="Ver" onclick="previewVersion('${v.id}')">👁</button><button class="icon-btn" title="Excluir" onclick="deleteVersion('${v.id}')">🗑</button></span>
    </div>`;
  }).join('');
}
function previewVersion(id){
  const v = loadVersions().find(x=>x.id===id); if(!v) return;
  modalShell('Pré-visualização de versão · '+v.label, `<div class="hint">Esta é uma visualização somente leitura de um estado salvo em ${v.label} ${v.time}. Nada aqui é persistido.</div>
    <table class="grid"><thead><tr><th>Projeto</th><th>Farol</th><th>Realizado</th></tr></thead><tbody>
    ${(v.snapshot.projects||[]).map(p=>`<tr><td>${esc(p.name)}</td><td><span class="farol-pill ${p.status}">${farolLabel(p.status)}</span></td><td>${projectProgressFromSnapshot(p)}%</td></tr>`).join('')}
    </tbody></table>`, `<button class="btn btn-primary" onclick="closeModal()">Fechar</button>`, 'wide');
}
function projectProgressFromSnapshot(p){ const phases=(p.phases||[]).filter(x=>!x.isMilestone); if(!phases.length) return 0; return Math.round(phases.reduce((s,ph)=>s+phaseRealizedProgress(ph),0)/phases.length); }
function deleteVersion(id){
  confirmDanger('Excluir esta versão salva? Esta ação não pode ser desfeita.', ()=>{
    const versions = loadVersions().filter(v=>v.id!==id);
    saveVersions(versions);
    sbDeleteVersion(id);
    closeModal();
    render();
  });
}

let __itFlagIds = [];
function openFlagChooserInline(btn){
  __itFlagIds = __itFlagIds.length ? __itFlagIds : [];
  const cell = document.getElementById('it_flags');
  const current = new Set([...cell.querySelectorAll('.flag-pill')].map(el=>el.dataset.id));
  const popup = document.createElement('div');
  popup.className='flag-popup';
  popup.innerHTML = state.flags.length ? state.flags.map(f=>`<div class="popup-option" data-fid="${f.id}"><span class="swatch" style="background:${f.color}"></span>${f.icon} ${esc(f.name)}</div>`).join('') : '<div class="popup-empty">Nenhuma flag cadastrada.</div>';
  document.body.appendChild(popup);
  const r = btn.getBoundingClientRect();
  popup.style.top=(r.bottom+4)+'px'; popup.style.left=r.left+'px';
  popup.querySelectorAll('.popup-option').forEach(opt=>{
    opt.addEventListener('click', ()=>{
      const fid = opt.dataset.fid;
      const f = state.flags.find(x=>x.id===fid);
      if(!current.has(fid)){
        current.add(fid);
        const pill = document.createElement('span');
        pill.className='flag-pill'; pill.dataset.id=fid;
        pill.style.cssText=`background:${f.color}22;border-color:${f.color};color:${f.color}`;
        pill.innerHTML = `${f.icon} ${esc(f.name)}<span class="pill-x" onclick="this.parentElement.remove()">✕</span>`;
        cell.insertBefore(pill, btn);
      }
      popup.remove();
    });
  });
  setTimeout(()=>document.addEventListener('click', function h(e){ if(!popup.contains(e.target) && e.target!==btn){ popup.remove(); document.removeEventListener('click',h); } }),0);
}
function collectFormFlagIds(){ return [...document.querySelectorAll('#it_flags .flag-pill')].map(el=>el.dataset.id); }

const TAP_SECTIONS = ['Identificação','Contexto/Justificativa','Objetivo','Escopo','Premissas/Restrições','Riscos','Critérios de Sucesso','Tamanho'];
function getTap(projectId){
  if(!state.tap[projectId]) state.tap[projectId] = { objetivo:'',justificativa:'',escopo_incluido:'',escopo_excluido:'',premissas:'',restricoes:'',riscos:'',criterios_sucesso:'',esforco:'',dependencia:'',sponsor:'',gerente:'',data_inicio:'',data_fim:'',versao:'1.0',horizonte:'',tamanho:'' };

}
function openTapModal(projectId){

  const body = `<div class="tap-shell">
    <div class="tap-nav">${TAP_SECTIONS.map((s,i)=>`<div class="tap-nav-item ${i===0?'active':''}" onclick="tapNav(this,${i})"><span class="tap-nav-num">${i+1}</span>${s}</div>`).join('')}</div>
    <div class="tap-content" id="tapContent">${TAP_SECTIONS.map((s,i)=>tapSectionHTML(s,i,project,tap)).join('')}</div>
  </div>`;
  modalShell('Termo de Abertura do Projeto (TAP) · '+esc(project.name), body, `
    <button class="btn btn-ghost" onclick="exportTapWord('${projectId}')">📄 Exportar Word</button>

    <button class="btn btn-primary" onclick="saveTap('${projectId}')">💾 Salvar TAP</button>
  `, 'xwide');
}
function tapNav(el,i){
  document.querySelectorAll('.tap-nav-item').forEach(x=>x.classList.remove('active')); el.classList.add('active');
  document.querySelectorAll('.tap-card').forEach((x,idx)=>x.scrollIntoView && idx===i && x.scrollIntoView({block:'start'}));
}
function tapSectionHTML(title, i, project, tap){
  if(i===0) return `<div class="tap-card"><h4>1. Identificação</h4>
    <div class="row2"><div class="field"><label>Empresa</label><input id="tap_company" value="${esc(project.company)}"></div><div class="field"><label>Tecnologia</label><input id="tap_tech" value="${esc(project.technology)}"></div></div>
    <div class="row2"><div class="field"><label>Sponsor</label><input id="tap_sponsor" value="${esc(tap.sponsor||project.sponsor)}"></div><div class="field"><label>Gerente do Projeto</label><input id="tap_gerente" value="${esc(tap.gerente)}"></div></div>
    <div class="row3"><div class="field"><label>Início</label><input type="date" id="tap_inicio" value="${tap.data_inicio||''}"></div><div class="field"><label>Fim</label><input type="date" id="tap_fim" value="${tap.data_fim||''}"></div><div class="field"><label>Versão</label><input id="tap_versao" value="${esc(tap.versao)}"></div></div>
  </div>`;
  if(i===1) return `<div class="tap-card"><h4>2. Contexto/Justificativa</h4><div class="field"><textarea id="tap_justificativa" rows="4">${esc(tap.justificativa)}</textarea></div></div>`;
  if(i===2) return `<div class="tap-card"><h4>3. Objetivo</h4><div class="field"><textarea id="tap_objetivo" rows="4">${esc(tap.objetivo)}</textarea></div></div>`;
  if(i===3) return `<div class="tap-card"><h4>4. Escopo</h4><div class="row2"><div class="field"><label>Incluído</label><textarea id="tap_esc_in">${esc(tap.escopo_incluido)}</textarea></div><div class="field"><label>Excluído</label><textarea id="tap_esc_out">${esc(tap.escopo_excluido)}</textarea></div></div></div>`;
  if(i===4) return `<div class="tap-card"><h4>5. Premissas e Restrições</h4><div class="row2"><div class="field"><label>Premissas</label><textarea id="tap_premissas">${esc(tap.premissas)}</textarea></div><div class="field"><label>Restrições</label><textarea id="tap_restricoes">${esc(tap.restricoes)}</textarea></div></div></div>`;
  if(i===5) return `<div class="tap-card"><h4>6. Riscos</h4><div class="tap-risk-grid" id="tapRiskGrid">${renderTapRiskRows(tap.riscos)}</div><button class="btn btn-ghost btn-sm" style="margin-top:8px" onclick="addTapRiskRow()">+ Risco</button></div>`;
  if(i===6) return `<div class="tap-card"><h4>7. Critérios de Sucesso</h4><div class="field"><textarea id="tap_criterios">${esc(tap.criterios_sucesso)}</textarea></div></div>`;
  return `<div class="tap-card"><h4>8. Estimativa de Tamanho</h4>
    <div class="row2"><div class="field"><label>Esforço</label><select id="tap_esforco" onchange="tapUpdateSize()">${ESFORCO_OPTIONS.map(o=>`<option value="${o.v}" ${o.v===tap.esforco?'selected':''}>${o.l}</option>`).join('')}</select></div>

function addTapRiskRow(){ document.getElementById('tapRiskGrid').insertAdjacentHTML('beforeend', tapRiskRowHTML()); }
function tapSetMatrix(e,d){ document.getElementById('tap_esforco').value=e; document.getElementById('tap_dependencia').value=d; tapUpdateSize(); }
function tapUpdateSize(){
  const e = document.getElementById('tap_esforco').value, d = document.getElementById('tap_dependencia').value;
  document.querySelectorAll('#tapMatrix .cell').forEach(c=>c.classList.toggle('cell-active', c.dataset.e===e && c.dataset.d===d));
  const sz = (e&&d) ? SIZE_MATRIX[e][d] : '';
  const box = document.getElementById('tapSizeResult');
  box.className = 'tap-size-result '+(sz||'empty');
  box.textContent = sz ? `${SIZE_LABELS[sz].label} (${sz}) — ${SIZE_LABELS[sz].desc}` : 'Selecione esforço e dependência.';
}
function collectTapRiscos(){
  return [...document.querySelectorAll('#tapRiskGrid .tap-risk-row')].map(row=>{
    const vals = row.querySelectorAll('select,input');
    return [vals[0].value, vals[1].value, vals[2].value, vals[3].value, vals[4].value].join('|');
  }).filter(l=>l.split('|').slice(1).some(Boolean)).join('\n');
}
function saveTap(projectId){
  const project = projectById(projectId);
  const e = document.getElementById('tap_esforco').value, d = document.getElementById('tap_dependencia').value;
  const tap = {
    objetivo:val('tap_objetivo'), justificativa:val('tap_justificativa'), escopo_incluido:val('tap_esc_in'), escopo_excluido:val('tap_esc_out'),
    premissas:val('tap_premissas'), restricoes:val('tap_restricoes'), riscos:collectTapRiscos(), criterios_sucesso:val('tap_criterios'),
    esforco:e, dependencia:d, tamanho: (e&&d)?SIZE_MATRIX[e][d]:'', sponsor:val('tap_sponsor'), gerente:val('tap_gerente'),
    data_inicio:val('tap_inicio'), data_fim:val('tap_fim'), versao:val('tap_versao'), horizonte:''
  };
  mutate(()=>{
    state.tap[projectId] = tap;
    project.company = val('tap_company'); project.technology = val('tap_tech'); project.sponsor = tap.sponsor;
  });
  toast('TAP salvo.');
}
function val(id){ const el=document.getElementById(id); return el?el.value:''; }
function exportTapWord(projectId){
  const project = projectById(projectId), tap = getTap(projectId);
  const riscosRows = (tap.riscos||'').split('\n').filter(Boolean).map(l=>{ const [tipo,risco,impacto,prob,acao]=l.split('|'); return `<tr><td>${esc(tipo||'')}</td><td>${esc(risco||'')}</td><td>${esc(impacto||'')}</td><td>${esc(prob||'')}</td><td>${esc(acao||'')}</td></tr>`; }).join('');
  const html = `<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
  <head><meta charset="utf-8"><title>TAP</title></head><body style="font-family:Calibri,sans-serif">
  <h1>Termo de Abertura do Projeto</h1><h2>${esc(project.name)}</h2>
  <p><b>Empresa:</b> ${esc(project.company||'')} · <b>Sponsor:</b> ${esc(tap.sponsor||'')} · <b>Gerente:</b> ${esc(tap.gerente||'')}</p>
  <p><b>Início:</b> ${fmtDate(tap.data_inicio)} · <b>Fim:</b> ${fmtDate(tap.data_fim)} · <b>Versão:</b> ${esc(tap.versao||'')}</p>
  <h3>1. Contexto/Justificativa</h3><p>${esc(tap.justificativa||'').replace(/\n/g,'<br>')}</p>
  <h3>2. Objetivo</h3><p>${esc(tap.objetivo||'').replace(/\n/g,'<br>')}</p>
  <h3>3. Escopo Incluído</h3><p>${esc(tap.escopo_incluido||'').replace(/\n/g,'<br>')}</p>
  <h3>4. Escopo Excluído</h3><p>${esc(tap.escopo_excluido||'').replace(/\n/g,'<br>')}</p>
  <h3>5. Premissas</h3><p>${esc(tap.premissas||'').replace(/\n/g,'<br>')}</p>
  <h3>6. Restrições</h3><p>${esc(tap.restricoes||'').replace(/\n/g,'<br>')}</p>
  <h3>7. Riscos</h3><table border="1" cellpadding="4" style="border-collapse:collapse"><tr><th>Tipo</th><th>Risco</th><th>Impacto</th><th>Probabilidade</th><th>Ação</th></tr>${riscosRows}</table>
  <h3>8. Critérios de Sucesso</h3><p>${esc(tap.criterios_sucesso||'').replace(/\n/g,'<br>')}</p>
  <h3>9. Tamanho do Projeto</h3><p>${tap.tamanho?SIZE_LABELS[tap.tamanho].label+' ('+tap.tamanho+')':'—'}</p>
  </body></html>`;
  const blob = new Blob(['﻿', html], {type:'application/msword'});
  const a = document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`TAP-${project.name.replace(/[^a-z0-9]/gi,'_')}.doc`; a.click(); URL.revokeObjectURL(a.href);
}

/* ================= Import / Export .xlsx ================= */
function downloadXLSX(){
  const wb = XLSX.utils.book_new();
  const pfRows = state.portfolios.map(p=>({'ID Portfólio':p.id,'Nome':p.name,'Justificativa':p.justification,'Metas':p.goals}));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(pfRows), 'Portfólios');
  const flagRows = state.flags.map(f=>({'ID Flag':f.id,'Nome':f.name,'Ícone':f.icon,'Cor (hex)':f.color}));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(flagRows), 'Flags');
  const projRows = state.projects.map(p=>({'ID Projeto':p.id,'Nome':p.name,'ID Portfólio':p.portfolioId||'','Nome do Portfólio':(portfolioById(p.portfolioId)||{}).name||'','Empresa':p.company,'Capacidades de Negócio':p.businessCapabilities,'Tecnologia':p.technology,'Patrocinador':p.sponsor,'Farol':p.status,'Justificativa do Farol':p.statusExplanation}));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(projRows), 'Projetos');
  const phRows = [];
  state.projects.forEach(p=>p.phases.forEach(ph=>{
    phRows.push({'ID Projeto':p.id,'ID Entrega':ph.id,'Nome da Entrega':ph.name,'Marco (Sim/Não)':ph.isMilestone?'Sim':'Não','Flags':(ph.flagIds||[]).map(id=>(state.flags.find(f=>f.id===id)||{}).name).join(';'),'IDs Flags':(ph.flagIds||[]).join(';'),'Progresso %':statusToProgress(ph.status),'Início Planejado':ph.plannedStart,'Fim Planejado':ph.plannedEnd,'Início Replanejado':ph.replannedStart,'Fim Replanejado':ph.replannedEnd,'Início Realizado':ph.actualStart,'Fim Realizado':ph.actualEnd});
  }));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(phRows), 'Entregas');
  const tRows = [];
  state.projects.forEach(p=>p.phases.forEach(ph=>(ph.tasks||[]).forEach(t=>{
    tRows.push({'ID Projeto':p.id,'ID Entrega':ph.id,'ID Tarefa':t.id,'Nome da Tarefa':t.name,'Flags':(t.flagIds||[]).map(id=>(state.flags.find(f=>f.id===id)||{}).name).join(';'),'IDs Flags':(t.flagIds||[]).join(';'),'Progresso %':statusToProgress(t.status),'Início Planejado':t.plannedStart,'Fim Planejado':t.plannedEnd,'Início Replanejado':t.replannedStart,'Fim Replanejado':t.replannedEnd,'Início Realizado':t.actualStart,'Fim Realizado':t.actualEnd});
  })));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(tRows), 'Tarefas');
  XLSX.writeFile(wb, `gestor-portfolio-${new Date().toISOString().slice(0,10)}.xlsx`);
}
function normalizeDate(v){
  if(!v) return '';
  if(typeof v==='number'){ const d=XLSX.SSF.parse_date_code(v); return `${d.y}-${String(d.m).padStart(2,'0')}-${String(d.d).padStart(2,'0')}`; }
  const s=String(v).trim();
  if(/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0,10);
  const m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);
  if(m){ let [,d,mo,y]=m; if(y.length===2) y='20'+y; return `${y}-${mo.padStart(2,'0')}-${d.padStart(2,'0')}`; }
  return '';
}
function normalizeStatus(v){
  const s=String(v||'').toLowerCase().trim();
  const map={'não iniciado':'not_started','not_started':'not_started','iniciado':'in_progress','in_progress':'in_progress','pronto p/ validação':'ready_to_validate','ready_to_validate':'ready_to_validate','validando':'validating','validating':'validating','pronto':'done','done':'done'};
  return map[s] || 'not_started';
}
function normalizeFarol(v){
  const s=String(v||'').toLowerCase().trim();
  if(['verde','green','g','🟢'].includes(s)) return 'green';
  if(['amarelo','yellow','y','🟡'].includes(s)) return 'yellow';
  if(['vermelho','red','r','🔴'].includes(s)) return 'red';
  if(['cinza','gray','sem farol',''].includes(s)) return 'gray';
  return 'green';
}
function uploadXLSX(ev){
  const file = ev.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = e=>{
    try{
      const wb = XLSX.read(e.target.result, {type:'array'});
      const sheet = name => wb.SheetNames.includes(name) ? XLSX.utils.sheet_to_json(wb.Sheets[name]) : [];
      const pfRows = sheet('Portfólios'), flagRows = sheet('Flags'), projRows = sheet('Projetos'), phRows = sheet('Entregas'), tRows = sheet('Tarefas');
      const newPortfolios = pfRows.filter(r=>r['Nome']||r['ID Portfólio']).map(r=>({id:r['ID Portfólio']||uid(), name:r['Nome']||'', justification:r['Justificativa']||'', goals:r['Metas']||''}));
      const newFlags = flagRows.length ? flagRows.filter(r=>r['Nome']||r['ID Flag']).map(r=>({id:r['ID Flag']||uid(), name:r['Nome']||'', icon:r['Ícone']||'🏷', color:r['Cor (hex)']||'#C9A84C'})) : state.flags;
      const pfIds = new Set(newPortfolios.map(p=>p.id));
      const newProjects = projRows.filter(r=>r['Nome']||r['ID Projeto']).map(r=>({
        id:r['ID Projeto']||uid(), name:r['Nome']||'', portfolioId: pfIds.has(r['ID Portfólio'])?r['ID Portfólio']:null,
        company:r['Empresa']||'', businessCapabilities:r['Capacidades de Negócio']||'', technology:r['Tecnologia']||'', sponsor:r['Patrocinador']||'',
        status: normalizeFarol(r['Farol']), statusExplanation:r['Justificativa do Farol']||'', srHighlight:'', srRisk:'', srDecision:'', phases:[]
      }));
      phRows.filter(r=>r['Nome da Entrega']||r['ID Entrega']).forEach(r=>{
        const proj = newProjects.find(p=>p.id===r['ID Projeto']); if(!proj) return;
        proj.phases.push({ id:r['ID Entrega']||uid(), name:r['Nome da Entrega']||'', isMilestone:(r['Marco (Sim/Não)']||'')==='Sim',
          flagIds:(r['IDs Flags']||'').split(';').filter(Boolean), status: normalizeStatus(''), progress:0,
          plannedStart:normalizeDate(r['Início Planejado']), plannedEnd:normalizeDate(r['Fim Planejado']),
          replannedStart:normalizeDate(r['Início Replanejado']), replannedEnd:normalizeDate(r['Fim Replanejado']),
          actualStart:normalizeDate(r['Início Realizado']), actualEnd:normalizeDate(r['Fim Realizado']), tasks:[] });
      });
      // status/progresso: aceitar valor numérico de "Progresso %" convertendo ao status mais próximo
      phRows.forEach(r=>{ const proj=newProjects.find(p=>p.id===r['ID Projeto']); if(!proj) return; const ph=proj.phases.find(p=>p.id===r['ID Entrega']); if(!ph) return; ph.status=progressToStatus(Number(r['Progresso %'])||0); ph.progress=statusToProgress(ph.status); });
      tRows.filter(r=>r['Nome da Tarefa']||r['ID Tarefa']).forEach(r=>{
        const proj = newProjects.find(p=>p.id===r['ID Projeto']); if(!proj) return;
        const ph = proj.phases.find(p=>p.id===r['ID Entrega']); if(!ph) return;
        const status = progressToStatus(Number(r['Progresso %'])||0);
        ph.tasks.push({ id:r['ID Tarefa']||uid(), name:r['Nome da Tarefa']||'', flagIds:(r['IDs Flags']||'').split(';').filter(Boolean), status, progress:statusToProgress(status),
          plannedStart:normalizeDate(r['Início Planejado']), plannedEnd:normalizeDate(r['Fim Planejado']),
          replannedStart:normalizeDate(r['Início Replanejado']), replannedEnd:normalizeDate(r['Fim Replanejado']),
          actualStart:normalizeDate(r['Início Realizado']), actualEnd:normalizeDate(r['Fim Realizado']) });
      });
      mutate(()=>{ state.portfolios = newPortfolios; state.flags = newFlags.length?newFlags:defaultFlags(); state.projects = newProjects; });
      toast('Importação concluída.');
    }catch(err){ alertModal('Arquivo inválido ou fora do formato esperado.'); }
  };
  reader.readAsArrayBuffer(file);
  ev.target.value='';
}

/* ================= Supabase (sem autenticação, workspace compartilhado) ================= */
const SUPABASE_URL = 'https://SEU-PROJETO.supabase.co';
const SUPABASE_ANON_KEY = 'SUA-ANON-KEY';
const cloudEnabled = /^https:\/\//.test(SUPABASE_URL) && SUPABASE_ANON_KEY.length > 40;
let sb = null;
if(cloudEnabled && typeof window.supabase !== 'undefined') sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

function setSync(st, label){
  const el = document.getElementById('syncBadge'); if(!el) return;
  if(!cloudEnabled){ el.style.display='none'; return; }
  el.style.display='inline-flex'; el.className='sync-badge '+st; el.innerHTML=`<i></i>${label}`;
}
let cloudTimer=null;
function scheduleCloud(){
  if(!cloudEnabled) return;
  clearTimeout(cloudTimer); setSync('saving','salvando…');
  cloudTimer = setTimeout(pushCloud, 800);
}
async function sbUpsert(table, rows, onConflict){
  if(!rows.length) return;
  await fetch(`${SUPABASE_URL}/rest/v1/${table}?on_conflict=${onConflict}`, {
    method:'POST', headers:{ 'apikey':SUPABASE_ANON_KEY, 'Authorization':'Bearer '+SUPABASE_ANON_KEY, 'Content-Type':'application/json', 'Prefer':'resolution=merge-duplicates' },
    body: JSON.stringify(rows)
  });
}
async function sbDelete(table, ids){
  if(!ids.length) return;
  await fetch(`${SUPABASE_URL}/rest/v1/${table}?id=not.in.(${ids.map(id=>`"${id}"`).join(',')})`, { method:'DELETE', headers:{ 'apikey':SUPABASE_ANON_KEY,'Authorization':'Bearer '+SUPABASE_ANON_KEY } });
}
async function pushCloud(){
  try{
    const pfRows = state.portfolios.map((p,i)=>({id:p.id,name:p.name,justification:p.justification,goals:p.goals,sort_order:i}));
    const flagRows = state.flags.map(f=>({id:f.id,name:f.name,icon:f.icon,color:f.color}));
    const projRows = state.projects.map((p,i)=>({id:p.id,name:p.name,portfolio_id:p.portfolioId,company:p.company,business_capabilities:p.businessCapabilities,technology:p.technology,sponsor:p.sponsor,status:p.status,status_explanation:p.statusExplanation,sr_highlight:p.srHighlight,sr_risk:p.srRisk,sr_decision:p.srDecision,sort_order:i}));
    const phRows = [], taskRows = [], phaseFlagRows = [], taskFlagRows = [];
    state.projects.forEach(p=>p.phases.forEach((ph,i)=>{
      phRows.push({id:ph.id,project_id:p.id,name:ph.name,is_milestone:ph.isMilestone,status:ph.status,planned_start:ph.plannedStart||null,planned_end:ph.plannedEnd||null,replanned_start:ph.replannedStart||null,replanned_end:ph.replannedEnd||null,actual_start:ph.actualStart||null,actual_end:ph.actualEnd||null,sort_order:i});
      (ph.flagIds||[]).forEach(fid=>phaseFlagRows.push({phase_id:ph.id,flag_id:fid}));
      (ph.tasks||[]).forEach((t,j)=>{
        taskRows.push({id:t.id,phase_id:ph.id,name:t.name,status:t.status,planned_start:t.plannedStart||null,planned_end:t.plannedEnd||null,replanned_start:t.replannedStart||null,replanned_end:t.replannedEnd||null,actual_start:t.actualStart||null,actual_end:t.actualEnd||null,sort_order:j});
        (t.flagIds||[]).forEach(fid=>taskFlagRows.push({task_id:t.id,flag_id:fid}));
      });
    }));
    await Promise.all([
      sbUpsert('portfolios', pfRows, 'id'), sbUpsert('flags', flagRows, 'id'),
      sbUpsert('projects', projRows, 'id'), sbUpsert('phases', phRows, 'id'), sbUpsert('tasks', taskRows, 'id')
    ]);
    await sbUpsert('phase_flags', phaseFlagRows, 'phase_id,flag_id');
    await sbUpsert('task_flags', taskFlagRows, 'task_id,flag_id');
    setSync('ok','sincronizado');
  }catch(e){ setSync('err','erro ao salvar'); }
}
async function loadFromSupabase(){
  if(!cloudEnabled) return;
  try{
    const headers = { 'apikey':SUPABASE_ANON_KEY, 'Authorization':'Bearer '+SUPABASE_ANON_KEY };
    const get = async (table, extra) => (await fetch(`${SUPABASE_URL}/rest/v1/${table}?select=*${extra||''}`, {headers})).json();
    const [pfRows, flagRows, projRows, phRows, taskRows, phaseFlagRows, taskFlagRows] = await Promise.all([
      get('portfolios','&order=sort_order.asc'), get('flags','&order=created_at.asc'), get('projects','&order=sort_order.asc'),
      get('phases','&order=sort_order.asc'), get('tasks','&order=sort_order.asc'), get('phase_flags'), get('task_flags')
    ]);
    if(!Array.isArray(projRows) || !projRows.length) return;
    const projects = projRows.map(p=>({
      id:p.id, name:p.name, portfolioId:p.portfolio_id, company:p.company, businessCapabilities:p.business_capabilities, technology:p.technology, sponsor:p.sponsor,
      status:p.status, statusExplanation:p.status_explanation, srHighlight:p.sr_highlight, srRisk:p.sr_risk, srDecision:p.sr_decision,
      phases: phRows.filter(ph=>ph.project_id===p.id).map(ph=>({
        id:ph.id, name:ph.name, isMilestone:ph.is_milestone, flagIds:phaseFlagRows.filter(x=>x.phase_id===ph.id).map(x=>x.flag_id),
        status:ph.status, progress:statusToProgress(ph.status), plannedStart:ph.planned_start, plannedEnd:ph.planned_end,
        replannedStart:ph.replanned_start, replannedEnd:ph.replanned_end, actualStart:ph.actual_start, actualEnd:ph.actual_end,
        tasks: taskRows.filter(t=>t.phase_id===ph.id).map(t=>({
          id:t.id, name:t.name, flagIds:taskFlagRows.filter(x=>x.task_id===t.id).map(x=>x.flag_id), status:t.status, progress:statusToProgress(t.status),
          plannedStart:t.planned_start, plannedEnd:t.planned_end, replannedStart:t.replanned_start, replannedEnd:t.replanned_end, actualStart:t.actual_start, actualEnd:t.actual_end
        }))
      }))
    }));
    state.portfolios = pfRows.map(p=>({id:p.id,name:p.name,justification:p.justification,goals:p.goals}));
    state.flags = flagRows.length ? flagRows.map(f=>({id:f.id,name:f.name,icon:f.icon,color:f.color})) : defaultFlags();
    state.projects = projects;
    save(); render();
    setSync('ok','sincronizado');
  }catch(e){ setSync('err','erro ao carregar'); }
}
async function sbSaveVersion(v){
  if(!cloudEnabled) return;
  try{ await sbUpsert('sr_versions', [{id:v.id,label:v.label,time:v.time,saved_at:v.saved_at,snapshot:v.snapshot}], 'id'); }catch(e){}
}
async function sbDeleteVersion(id){
  if(!cloudEnabled) return;
  try{ await fetch(`${SUPABASE_URL}/rest/v1/sr_versions?id=eq.${id}`, {method:'DELETE', headers:{'apikey':SUPABASE_ANON_KEY,'Authorization':'Bearer '+SUPABASE_ANON_KEY}}); }catch(e){}
}

/* ================= Init ================= */
render();
setSync('off','');
if(cloudEnabled) loadFromSupabase();
</script>
