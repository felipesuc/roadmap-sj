<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Roadmap Empresas SJ</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0D1B2A;
  --ink-soft:#43536A;
  --ink-faint:#8A96A8;
  --gold:#C9A84C;
  --gold-soft:#F5EDD8;
  --line:#E4E8EE;
  --line-soft:#F0F3F7;
  --bg:#FFFFFF;
  --bg-soft:#F8FAFC;
  --verde:#1B9E4B;
  --verde-bg:#E7F6EC;
  --amarelo:#D99000;
  --amarelo-bg:#FCF3DD;
  --vermelho:#D64545;
  --vermelho-bg:#FBE9E9;
  --azul:#2563EB;
  --azul-bg:#E8EFFD;
  --radius:10px;
  --shadow:0 1px 2px rgba(13,27,42,.06),0 4px 14px rgba(13,27,42,.07);
  --shadow-lg:0 8px 40px rgba(13,27,42,.18);
  /* Aliases para compatibilidade com o app */
  --navy:var(--ink);
  --navy-light:#1c3050;
  --navy-soft:var(--ink-soft);
  --yellow:var(--gold);
  --yellow-soft:var(--gold-soft);
  --yellow-dark:#B3913B;
  --bg-tint:var(--bg-soft);
  --card:#FFFFFF;
  --border:var(--line);
  --border-soft:var(--line-soft);
  --text:var(--ink);
  --muted:var(--ink-faint);
  --red:var(--vermelho);
  --green:var(--verde);
  --amber:var(--amarelo);
  --shadow-sm:0 1px 2px rgba(13,27,42,.06);
  --shadow-md:var(--shadow);
  --shadow-xl:var(--shadow-lg);
  --radius-sm:6px;
  --radius-lg:14px;
  --ease:cubic-bezier(.4,0,.2,1);
  font-size:15px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'IBM Plex Sans',sans-serif;
  background:var(--bg);
  color:var(--ink);
  font-size:.92rem;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
}
.mono{font-family:'IBM Plex Mono',monospace}

/* ---------- Topbar (header) ---------- */
header{
  position:sticky;top:0;z-index:40;
  background:#fff;
  border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:14px;
  padding:0 24px;height:58px;
}
header h1{
  font-size:1.02rem;font-weight:700;letter-spacing:-.01em;color:var(--ink);
  display:flex;align-items:center;gap:10px;
}
header h1::before{
  content:"";width:11px;height:11px;background:var(--gold);
  border-radius:2px;transform:rotate(45deg);flex-shrink:0;
}
header .badge{
  font-family:'IBM Plex Mono',monospace;
  font-size:.68rem;color:var(--ink-faint);
  letter-spacing:.08em;text-transform:uppercase;
  background:transparent;padding:0;border-radius:0;
  box-shadow:none;font-weight:500;
}

/* ---------- Toolbar ---------- */
.toolbar{
  background:#fff;
  padding:12px 24px;
  border-bottom:1px solid var(--line);
  display:flex;gap:8px;flex-wrap:wrap;align-items:center;
}
button,.btn-file{
  display:inline-flex;align-items:center;gap:7px;
  padding:8px 14px;border-radius:8px;
  font-size:.86rem;font-weight:600;
  transition:.12s;white-space:nowrap;
  font-family:inherit;cursor:pointer;border:none;
  background:var(--ink);color:#fff;
}
button:hover,.btn-file:hover{background:var(--navy-light)}
button:active{transform:translateY(1px)}
button.secondary{background:var(--gold);color:var(--ink)}
button.secondary:hover{filter:brightness(1.05);background:var(--gold)}
button.danger{background:var(--vermelho);color:#fff}
button.danger:hover{filter:brightness(1.08)}
button.ghost{border:1px solid var(--line);color:var(--ink-soft);background:#fff}
button.ghost:hover{border-color:var(--ink-faint);color:var(--ink);background:#fff}
.btn-file{position:relative;overflow:hidden}
.btn-file input[type=file]{position:absolute;left:0;top:0;opacity:0;width:100%;height:100%;cursor:pointer}
.toolbar .spacer{flex:1}

main{padding:18px 24px 40px}

/* ---------- Timeline container ---------- */
.timeline-wrap{
  background:#fff;
  border:1px solid var(--line);
  border-radius:var(--radius);
  overflow:hidden;
  box-shadow:var(--shadow);
}
.year-row{display:flex;background:var(--bg-soft);border-bottom:1px solid var(--line)}
.year-row .col-info{width:360px;flex-shrink:0;border-right:1px solid var(--line)}
.year-row .years{flex:1;display:flex;min-width:600px}
.year-mark{
  text-align:center;padding:7px 4px;
  font-family:'IBM Plex Mono',monospace;
  font-size:.72rem;font-weight:600;letter-spacing:.12em;
  color:var(--ink);
  border-right:1px solid var(--line-soft);
}
.timeline-header{
  display:flex;background:var(--bg-soft);color:var(--ink-soft);
  border-bottom:2px solid var(--ink);
}
.timeline-header .col-info{
  width:360px;padding:9px 16px;
  font-family:'IBM Plex Mono',monospace;
  font-size:.68rem;font-weight:600;
  letter-spacing:.1em;text-transform:uppercase;
  border-right:1px solid var(--line);
  display:flex;align-items:center;
}
.timeline-header .col-timeline{flex:1;min-width:600px}
.month-marks{display:flex;height:100%}
.month-mark{
  flex:1;text-align:center;padding:9px 2px;
  font-family:'IBM Plex Mono',monospace;
  font-size:.62rem;letter-spacing:.04em;text-transform:uppercase;
  color:var(--ink-faint);
  border-right:1px solid var(--line-soft);
  white-space:nowrap;overflow:hidden;
}

/* ---------- Project row ---------- */
.project-row{
  display:flex;
  border-bottom:1px solid var(--line-soft);
  min-height:90px;
  transition:background .12s;
}
.project-row:hover{background:var(--bg-soft)}
.project-row:last-child{border-bottom:none}
.project-info{
  width:360px;flex-shrink:0;
  padding:12px 14px;
  border-right:1px solid var(--line);
  display:flex;flex-direction:column;gap:8px;
  font-size:.78rem;
}
.proj-header{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px}

/* ---------- Farol pill ---------- */
.status-pill{
  display:inline-flex;align-items:center;gap:6px;
  padding:4px 10px;border-radius:999px;
  font-family:'IBM Plex Mono',monospace;
  font-size:.64rem;font-weight:600;
  text-transform:uppercase;letter-spacing:.06em;
  cursor:pointer;border:1px solid;
  transition:.12s;user-select:none;white-space:nowrap;
}
.status-pill:hover{filter:brightness(.97);transform:translateY(-1px)}
.status-pill:active{transform:none}
.status-pill .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.status-pill.green{background:var(--verde-bg);color:var(--verde);border-color:var(--verde)}
.status-pill.green .dot{background:var(--verde);box-shadow:0 0 0 2px rgba(27,158,75,.2)}
.status-pill.yellow{background:var(--amarelo-bg);color:var(--amarelo);border-color:var(--amarelo)}
.status-pill.yellow .dot{background:var(--amarelo);box-shadow:0 0 0 2px rgba(217,144,0,.2)}
.status-pill.red{background:var(--vermelho-bg);color:var(--vermelho);border-color:var(--vermelho)}
.status-pill.red .dot{background:var(--vermelho);box-shadow:0 0 0 2px rgba(214,69,69,.2)}
.status-pill.gray{background:var(--line-soft);color:var(--ink-faint);border-color:var(--line)}
.status-pill.gray .dot{background:var(--ink-faint)}

/* Toggle expand/collapse */
.proj-toggle{
  background:#fff;color:var(--ink-faint);
  border:1px solid transparent;
  width:26px;height:26px;padding:0;border-radius:6px;
  display:inline-flex;align-items:center;justify-content:center;
  cursor:pointer;font-size:.72rem;line-height:1;
  transition:.12s;
}
.proj-toggle:hover{background:var(--bg-soft);color:var(--ink);border-color:var(--line)}
.proj-toggle .chev{display:inline-block;transition:transform .18s}
.project-row.expanded .proj-toggle .chev{transform:rotate(180deg)}

.proj-name{
  font-weight:600;color:var(--ink);
  font-size:.92rem;padding:4px 6px;width:100%;
}
.editable{
  border:1px solid transparent;background:transparent;
  font-family:inherit;color:var(--ink);
  border-radius:6px;transition:.12s;width:100%;
  padding:4px 6px;font-size:inherit;
}
.editable:hover:not(:focus){background:var(--bg-soft);border-color:var(--line)}
.editable:focus{outline:2px solid var(--gold);outline-offset:1px;background:#fff;border-color:var(--gold)}
textarea.editable{resize:vertical;line-height:1.45}

.proj-field-row{display:grid;grid-template-columns:62px 1fr;align-items:start;gap:4px}
.proj-field-row label{
  font-family:'IBM Plex Mono',monospace;
  font-size:.6rem;font-weight:600;color:var(--ink-faint);
  text-transform:uppercase;letter-spacing:.08em;padding-top:7px;
}

/* ---------- Collapsible details ---------- */
.proj-details{
  display:none;flex-direction:column;gap:6px;
  padding-top:6px;margin-top:2px;
  border-top:1px dashed var(--line);
  animation:fadeSlide .16s ease-out;
}
.project-row.expanded .proj-details{display:flex}
@keyframes fadeSlide{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}

/* ---------- Motivo do farol ---------- */
.farol-reason{
  margin-top:4px;padding:9px 11px;
  border-radius:8px;border-left:3px solid;
  display:flex;flex-direction:column;gap:5px;
}
.farol-reason.green{border-left-color:var(--verde);background:var(--verde-bg)}
.farol-reason.yellow{border-left-color:var(--amarelo);background:var(--amarelo-bg)}
.farol-reason.red{border-left-color:var(--vermelho);background:var(--vermelho-bg)}
.farol-reason .farol-label{
  font-family:'IBM Plex Mono',monospace;
  font-size:.6rem;font-weight:600;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-soft);
  display:flex;align-items:center;gap:6px;
}
.farol-reason .farol-label .marker{width:7px;height:7px;border-radius:50%;display:inline-block}
.farol-reason.green .farol-label .marker{background:var(--verde)}
.farol-reason.yellow .farol-label .marker{background:var(--amarelo)}
.farol-reason.red .farol-label .marker{background:var(--vermelho)}
.farol-reason textarea{
  width:100%;border:1px solid transparent;
  background:rgba(255,255,255,.65);
  padding:6px 9px;font-family:inherit;font-size:.8rem;
  color:var(--ink);border-radius:6px;resize:vertical;
  min-height:36px;line-height:1.45;
}
.farol-reason textarea:hover:not(:focus){background:#fff;border-color:var(--line)}
.farol-reason textarea:focus{outline:2px solid var(--gold);outline-offset:1px;background:#fff;border-color:var(--gold)}

/* ---------- Progresso ---------- */
.proj-progress{
  margin-top:2px;padding:7px 9px;
  background:var(--bg-soft);border-radius:8px;
  border:1px solid var(--line-soft);
}
.progress-labels{
  display:flex;justify-content:space-between;
  font-family:'IBM Plex Mono',monospace;
  font-size:.64rem;color:var(--ink-faint);
  margin-bottom:5px;letter-spacing:.02em;
}
.progress-labels strong{color:var(--ink);font-weight:600}
.progress-bar-wrap{
  position:relative;height:6px;
  background:var(--line);border-radius:3px;overflow:hidden;
}
.progress-bar-fill{position:absolute;left:0;top:0;height:100%;border-radius:3px;transition:width .3s}
.progress-bar-fill.predicted{background:var(--gold);opacity:.55}
.progress-bar-fill.realized{background:var(--ink)}

.proj-actions{display:flex;gap:5px;margin-top:4px;flex-wrap:wrap}
.proj-actions button{padding:5px 10px;font-size:.76rem}

/* ---------- Timeline / bars ---------- */
.project-timeline{flex:1;min-width:600px;position:relative;padding:8px 0}
.phase-bar{
  position:absolute;height:24px;
  background:var(--ink-soft);color:#fff;
  border-radius:6px;font-size:.68rem;font-weight:600;
  display:flex;align-items:center;gap:3px;
  padding:0 8px;overflow:hidden;white-space:nowrap;
  cursor:pointer;box-shadow:var(--shadow-sm);
  transition:box-shadow .12s,filter .12s;
}
.phase-bar:hover{box-shadow:var(--shadow-lg);filter:brightness(1.06);z-index:5}
.phase-bar.replanned{
  background:repeating-linear-gradient(45deg,var(--ink-soft),var(--ink-soft) 4px,var(--ink) 4px,var(--ink) 8px);
}
.phase-bar.actual{background:var(--verde)}
.phase-bar.dev-start{background:var(--gold);color:var(--ink)}
.phase-bar .bar-flag{font-size:.72rem;line-height:1;margin-right:1px}
.milestone{
  position:absolute;width:14px;height:14px;
  background:var(--gold);border:2px solid var(--ink);
  transform:rotate(45deg) translateY(-2px);
  cursor:pointer;transition:.12s;
}
.milestone:hover{filter:brightness(1.1);box-shadow:var(--shadow)}

/* Row striping in timeline area follows the project row */
.project-timeline{background:transparent}

/* ---------- Legend ---------- */
.legend{
  display:flex;gap:16px;align-items:center;flex-wrap:wrap;
  padding:10px 16px;background:var(--bg-soft);
  border-top:1px solid var(--line);
  font-family:'IBM Plex Mono',monospace;
  font-size:.66rem;color:var(--ink-soft);letter-spacing:.02em;
}
.legend .item{display:flex;align-items:center;gap:6px}
.legend .swatch{width:16px;height:8px;border-radius:2px;display:inline-block}
.legend .swatch.planned{background:var(--ink-soft)}
.legend .swatch.replanned{background:repeating-linear-gradient(45deg,var(--ink-soft),var(--ink-soft) 3px,var(--ink) 3px,var(--ink) 6px)}
.legend .swatch.actual{background:var(--verde)}
.legend .swatch.dev{background:var(--gold)}
.legend .ms{
  width:9px;height:9px;background:var(--gold);
  border:2px solid var(--ink);transform:rotate(45deg);display:inline-block;
}

/* ---------- Portfolio groups ---------- */
.portfolio-block{border-bottom:1px solid var(--line)}
.portfolio-block:last-child{border-bottom:none}
.portfolio-header{
  background:#fff;color:var(--ink);
  padding:12px 18px;
  display:flex;align-items:center;gap:12px;
  cursor:pointer;user-select:none;
  border-bottom:1px solid var(--line);
  transition:background .12s;
}
.portfolio-header:hover{background:var(--bg-soft)}
.portfolio-header .toggle-arrow{
  transition:transform .2s;font-size:.7rem;color:var(--ink-faint);
}
.portfolio-block.collapsed .portfolio-header .toggle-arrow{transform:rotate(-90deg)}
.portfolio-block.collapsed .portfolio-body{display:none}
.portfolio-header .icon{display:none}
.portfolio-header .name{
  font-size:.95rem;font-weight:700;flex:1;letter-spacing:-.01em;
  display:flex;align-items:center;gap:9px;
}
.portfolio-header .name::before{
  content:"";width:4px;height:18px;background:var(--gold);border-radius:2px;flex-shrink:0;
}
.portfolio-header .counts{
  font-family:'IBM Plex Mono',monospace;
  font-size:.66rem;color:var(--ink-faint);font-weight:500;
  background:var(--bg-soft);border:1px solid var(--line);
  padding:2px 9px;border-radius:999px;letter-spacing:.02em;
}
.portfolio-header .actions{display:flex;gap:5px}
.portfolio-header .actions button{
  background:#fff;color:var(--ink-soft);
  padding:5px 10px;font-size:.74rem;
  border:1px solid var(--line);border-radius:7px;
}
.portfolio-header .actions button:hover{border-color:var(--ink-faint);color:var(--ink);background:#fff}

.portfolio-meta{
  background:var(--bg-soft);
  padding:12px 18px;
  border-bottom:1px solid var(--line-soft);
  font-size:.78rem;
  display:grid;grid-template-columns:1fr 1fr;gap:10px 18px;
}
.portfolio-meta .meta-block{
  background:#fff;padding:9px 12px;
  border-radius:8px;border:1px solid var(--line);
  border-left:3px solid var(--gold);
}
.portfolio-meta .meta-label{
  font-family:'IBM Plex Mono',monospace;
  font-size:.6rem;font-weight:600;color:var(--ink-faint);
  text-transform:uppercase;letter-spacing:.1em;margin-bottom:3px;
}
.portfolio-meta .meta-content{color:var(--ink);line-height:1.5;white-space:pre-wrap}
.portfolio-meta .meta-content:empty:before{content:'—';color:var(--ink-faint)}

.ungrouped-header{
  background:var(--bg-soft);color:var(--ink-faint);
  padding:9px 18px;
  font-family:'IBM Plex Mono',monospace;
  font-size:.66rem;font-weight:600;
  text-transform:uppercase;letter-spacing:.1em;
  border-bottom:1px solid var(--line);
}

/* ---------- Flags ---------- */
.flag-pill{
  display:inline-flex;align-items:center;gap:4px;
  padding:2px 8px;border-radius:999px;
  font-size:.68rem;font-weight:600;
  border:1px solid;line-height:1.4;white-space:nowrap;
}
.flag-pill .pill-icon{font-size:.72rem}
.flag-pill .pill-x{cursor:pointer;margin-left:2px;font-weight:700;opacity:.55;padding:0 1px}
.flag-pill .pill-x:hover{opacity:1}
.flag-cell{display:flex;flex-wrap:wrap;gap:4px;align-items:center;min-height:22px;padding:2px}
.flag-add-btn{
  background:transparent;color:var(--ink-faint);
  border:1px dashed var(--line);
  padding:1px 8px;font-size:.7rem;border-radius:999px;
  cursor:pointer;line-height:1.5;font-weight:600;
}
.flag-add-btn:hover{background:var(--gold-soft);border-color:var(--gold);border-style:solid;color:var(--ink)}

.flag-popup{
  position:absolute;background:#fff;
  border:1px solid var(--line);border-radius:8px;
  box-shadow:var(--shadow-lg);z-index:500;
  padding:4px;min-width:190px;max-width:260px;
  max-height:240px;overflow-y:auto;
}
.flag-popup .popup-option{
  display:flex;align-items:center;gap:7px;
  padding:6px 8px;border-radius:6px;cursor:pointer;font-size:.82rem;
}
.flag-popup .popup-option:hover{background:var(--bg-soft)}
.flag-popup .popup-option .swatch{width:9px;height:9px;border-radius:50%}
.flag-popup .popup-empty{padding:8px;color:var(--ink-faint);font-size:.76rem;text-align:center}

/* ---------- Flags modal list ---------- */
.flag-list-row{
  display:grid;grid-template-columns:56px 1fr 100px 50px;
  gap:8px;align-items:center;padding:7px 4px;
  border-bottom:1px solid var(--line-soft);
}
.flag-list-row:last-child{border-bottom:none}
.flag-list-row .preview{display:flex;align-items:center;justify-content:center}
.flag-list-row input[type=color]{
  width:100%;height:32px;border:1px solid var(--line);
  border-radius:7px;cursor:pointer;background:#fff;padding:2px;
}
.flag-list-row .icon-input{text-align:center;font-size:1rem}
.flag-list-row input[type=text]{
  border:1px solid var(--line);border-radius:7px;
  padding:6px 9px;font-size:.84rem;font-family:inherit;background:#fff;
}
.flag-list-row input[type=text]:focus{outline:2px solid var(--gold);outline-offset:1px;border-color:var(--gold)}

/* ---------- Portfolio modal ---------- */
.program-list-item{
  border:1px solid var(--line);border-radius:8px;
  margin-bottom:6px;padding:9px 11px;
  display:grid;grid-template-columns:1fr 80px;
  gap:8px;align-items:center;background:var(--bg-soft);
}
.program-list-item input{
  width:100%;border:1px solid var(--line);border-radius:7px;
  padding:7px 10px;font-size:.86rem;font-family:inherit;background:#fff;
}
.program-list-item input:focus{outline:2px solid var(--gold);outline-offset:1px;border-color:var(--gold)}
.program-list-item .pli-actions{display:flex;gap:4px;justify-content:flex-end}

/* ---------- TAP / Cadastro ---------- */
.tap-section{margin-bottom:24px}
.tap-section-title{
  font-family:'IBM Plex Mono',monospace;
  font-size:.68rem;font-weight:600;color:var(--ink);
  text-transform:uppercase;letter-spacing:.12em;
  padding:6px 0 10px;border-bottom:2px solid var(--ink);
  margin-bottom:14px;
  display:flex;align-items:center;gap:9px;
}
.tap-section-title .num{
  background:var(--ink);color:var(--gold);
  width:22px;height:22px;border-radius:5px;
  display:inline-flex;align-items:center;justify-content:center;
  font-size:.7rem;font-weight:700;letter-spacing:0;
}
.tap-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.tap-grid.cols-2{grid-template-columns:1fr 1fr}
.tap-grid.cols-1{grid-template-columns:1fr}
.tap-field label{
  display:block;
  font-family:'IBM Plex Mono',monospace;
  font-size:.62rem;font-weight:600;color:var(--ink-faint);
  text-transform:uppercase;letter-spacing:.1em;margin-bottom:5px;
}
.tap-field input,.tap-field textarea,.tap-field select{
  width:100%;padding:8px 11px;
  border:1px solid var(--line);border-radius:8px;
  font-size:.88rem;font-family:inherit;background:#fff;
  transition:.12s;color:var(--ink);
}
.tap-field textarea{resize:vertical;min-height:72px;line-height:1.5}
.tap-field input:focus,.tap-field textarea:focus,.tap-field select:focus{
  outline:2px solid var(--gold);outline-offset:1px;border-color:var(--gold);
}

/* Risk table */
.risk-table{
  width:100%;border-collapse:separate;border-spacing:0;
  font-size:.82rem;background:#fff;
  border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;
}
.risk-table th{
  background:var(--bg-soft);color:var(--ink-soft);
  font-family:'IBM Plex Mono',monospace;
  font-size:.62rem;font-weight:600;
  text-transform:uppercase;letter-spacing:.08em;
  padding:9px 10px;text-align:left;
  border-bottom:2px solid var(--ink);
}
.risk-table td{padding:4px;border-bottom:1px solid var(--line-soft);vertical-align:top}
.risk-table tr:last-child td{border-bottom:none}
.risk-table textarea,.risk-table select{
  width:100%;border:1px solid transparent;background:transparent;
  padding:6px 8px;font-size:.8rem;font-family:inherit;
  resize:vertical;min-height:32px;line-height:1.45;border-radius:6px;transition:.12s;
}
.risk-table textarea:focus,.risk-table select:focus{outline:2px solid var(--gold);outline-offset:0;background:#fff;border-color:var(--gold)}
.risk-table textarea:hover:not(:focus),.risk-table select:hover:not(:focus){background:var(--bg-soft)}

/* Sizing methodology */
.sizing-wrap{
  background:var(--bg-soft);
  border:1px solid var(--line);
  border-radius:var(--radius);padding:18px;
}
.sizing-criteria{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:18px}
.sizing-criteria table{
  width:100%;border-collapse:separate;border-spacing:0;
  background:#fff;border:1px solid var(--line);
  border-radius:8px;overflow:hidden;font-size:.78rem;
}
.sizing-criteria th,.sizing-criteria td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--line-soft)}
.sizing-criteria th{
  background:var(--ink);color:#fff;
  font-family:'IBM Plex Mono',monospace;
  font-size:.6rem;text-transform:uppercase;letter-spacing:.08em;font-weight:600;
}
.sizing-criteria td:first-child{
  font-family:'IBM Plex Mono',monospace;
  font-weight:600;color:var(--ink);width:50px;text-align:center;
  background:var(--bg-soft);font-size:.72rem;
}
.sizing-criteria tr:last-child td{border-bottom:none}

.sizing-matrix{background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.sizing-matrix table{width:100%;border-collapse:separate;border-spacing:0;font-size:.8rem}
.sizing-matrix th,.sizing-matrix td{
  padding:9px 8px;text-align:center;
  border-bottom:1px solid var(--line-soft);
  border-right:1px solid var(--line-soft);
}
.sizing-matrix th{
  background:var(--ink);color:#fff;
  font-family:'IBM Plex Mono',monospace;
  font-size:.6rem;text-transform:uppercase;letter-spacing:.06em;font-weight:600;
}
.sizing-matrix th:first-child{background:#16273d}
.sizing-matrix td:first-child{
  background:var(--bg-soft);
  font-family:'IBM Plex Mono',monospace;
  font-weight:600;color:var(--ink);
  text-align:left;padding-left:12px;font-size:.72rem;
}
.sizing-matrix tr:last-child td{border-bottom:none}
.sizing-matrix td:last-child,.sizing-matrix th:last-child{border-right:none}
.sizing-matrix .size-P{background:var(--verde-bg);color:var(--verde);font-weight:700}
.sizing-matrix .size-M{background:var(--amarelo-bg);color:var(--amarelo);font-weight:700}
.sizing-matrix .size-G{background:#FDEBD9;color:#C2560C;font-weight:700}
.sizing-matrix .size-EG{background:var(--vermelho-bg);color:var(--vermelho);font-weight:700}
.sizing-matrix td.highlighted{outline:2.5px solid var(--ink);outline-offset:-2.5px;position:relative;z-index:2}

.sizing-result{
  background:#fff;border:1px solid var(--line);
  border-radius:8px;padding:14px 18px;
  display:grid;grid-template-columns:1fr 1fr auto;
  gap:14px;align-items:end;margin-top:16px;
}
.sizing-result label{
  display:block;
  font-family:'IBM Plex Mono',monospace;
  font-size:.62rem;font-weight:600;color:var(--ink-faint);
  text-transform:uppercase;letter-spacing:.1em;margin-bottom:5px;
}
.sizing-result select{
  width:100%;padding:8px 11px;
  border:1px solid var(--line);border-radius:8px;
  font-size:.86rem;font-family:inherit;background:#fff;
}
.sizing-result select:focus{outline:2px solid var(--gold);outline-offset:1px;border-color:var(--gold)}
.sizing-result .result-pill{
  display:inline-flex;align-items:center;justify-content:center;
  padding:11px 22px;border-radius:999px;
  font-family:'IBM Plex Mono',monospace;
  font-weight:700;font-size:1rem;letter-spacing:.04em;
  min-width:160px;border:1.5px solid;
}
.sizing-result .result-pill.size-P{background:var(--verde-bg);color:var(--verde);border-color:var(--verde)}
.sizing-result .result-pill.size-M{background:var(--amarelo-bg);color:var(--amarelo);border-color:var(--amarelo)}
.sizing-result .result-pill.size-G{background:#FDEBD9;color:#C2560C;border-color:#C2560C}
.sizing-result .result-pill.size-EG{background:var(--vermelho-bg);color:var(--vermelho);border-color:var(--vermelho)}
.sizing-result .result-pill.size-none{
  background:var(--bg-soft);color:var(--ink-faint);
  border-color:var(--line);border-style:dashed;
  font-weight:500;font-size:.78rem;padding:13px 22px;font-family:'IBM Plex Sans',sans-serif;
}

/* ---------- Modal ---------- */
.modal-backdrop{
  position:fixed;inset:0;
  background:rgba(13,27,42,.45);
  display:none;align-items:flex-start;justify-content:center;
  z-index:100;padding:6vh 16px;overflow-y:auto;
}
.modal-backdrop.open{display:flex}
.modal{
  background:#fff;border-radius:14px;
  box-shadow:var(--shadow-lg);
  width:100%;max-width:1200px;overflow:hidden;
  animation:pop .14s ease-out;margin:auto 0;
}
@keyframes pop{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.modal-header{
  display:flex;align-items:center;gap:10px;
  padding:16px 22px;border-bottom:1px solid var(--line);
  background:#fff;color:var(--ink);
}
.modal-header h2{font-size:1.02rem;font-weight:700;flex:1;letter-spacing:-.01em}
.modal-header button.close{
  background:#fff;color:var(--ink-faint);
  font-size:1rem;padding:4px 10px;line-height:1;
  border:1px solid var(--line);border-radius:7px;
}
.modal-header button.close:hover{color:var(--ink);border-color:var(--ink-faint);background:#fff}
.modal-body{padding:20px 22px}
.modal-footer{
  display:flex;gap:10px;padding:14px 22px;
  border-top:1px solid var(--line);justify-content:flex-end;
  background:var(--bg-soft);position:sticky;bottom:0;
}

.section-title{
  font-family:'IBM Plex Mono',monospace;
  font-size:.68rem;font-weight:600;color:var(--ink);
  text-transform:uppercase;letter-spacing:.12em;
  margin-bottom:12px;padding-bottom:8px;
  border-bottom:2px solid var(--ink);
  display:flex;align-items:center;justify-content:space-between;gap:10px;
}
.section-title button{letter-spacing:normal;text-transform:none;font-family:'IBM Plex Sans',sans-serif}

/* ---------- Tables (fases/tarefas) ---------- */
.table-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius)}
table.items{width:100%;border-collapse:separate;border-spacing:0;font-size:.82rem;table-layout:fixed;min-width:1000px}
table.items th{
  background:var(--bg-soft);color:var(--ink-soft);
  font-family:'IBM Plex Mono',monospace;
  font-size:.6rem;font-weight:600;
  text-transform:uppercase;letter-spacing:.08em;
  padding:9px 8px;text-align:left;
  border-bottom:2px solid var(--ink);
  border-right:1px solid var(--line-soft);
  position:relative;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;
}
table.items th.group{text-align:center;border-bottom:1px solid var(--line)}
table.items th:last-child{border-right:none}
table.items td{
  padding:5px 6px;border-bottom:1px solid var(--line-soft);
  border-right:1px solid var(--line-soft);vertical-align:middle;
  word-wrap:break-word;overflow-wrap:break-word;
}
table.items td:last-child{border-right:none}
table.items tr:last-child td{border-bottom:none}
table.items tr:hover td{background:var(--bg-soft)}
table.items input[type=date],table.items select{
  width:100%;border:1px solid transparent;background:transparent;
  padding:5px 6px;font-size:.78rem;font-family:inherit;border-radius:6px;transition:.12s;
}
table.items input[type=date]:hover,table.items select:hover{background:#fff;border-color:var(--line)}
table.items input[type=date]:focus,table.items select:focus{outline:2px solid var(--gold);outline-offset:0;background:#fff;border-color:var(--gold)}
table.items textarea{
  width:100%;border:1px solid transparent;background:transparent;
  padding:5px 7px;font-size:.82rem;font-family:inherit;font-weight:500;
  resize:vertical;min-height:30px;line-height:1.4;border-radius:6px;
  overflow:hidden;transition:.12s;
}
table.items textarea:hover:not(:focus){background:#fff;border-color:var(--line)}
table.items textarea:focus{outline:2px solid var(--gold);outline-offset:0;background:#fff;border-color:var(--gold)}
table.items .dates input{font-family:'IBM Plex Mono',monospace;font-size:.72rem}
.calc-cell{
  font-family:'IBM Plex Mono',monospace;
  text-align:center;color:var(--ink-soft);
  font-size:.76rem;font-weight:600;background:var(--bg-soft);
}
.progress-cell select{text-align:center;font-family:'IBM Plex Mono',monospace;font-weight:600}
td.actions{text-align:center;white-space:nowrap}

/* Column resizer */
th .col-resizer{
  position:absolute;right:-3px;top:0;bottom:0;width:7px;
  cursor:col-resize;z-index:10;
}
th .col-resizer:hover,th .col-resizer.resizing{background:var(--gold)}

/* ---------- Icon buttons ---------- */
.icon-btn{
  width:28px;height:28px;
  display:inline-flex;align-items:center;justify-content:center;
  border-radius:7px;color:var(--ink-faint);font-size:.85rem;
  border:1px solid transparent;background:transparent;
  padding:0;transition:.12s;
}
.icon-btn:hover{background:var(--bg-soft);color:var(--ink);border-color:var(--line);transform:none}
.icon-btn.del:hover{background:var(--vermelho-bg);color:var(--vermelho);border-color:var(--vermelho)}

.help-text{
  font-size:.74rem;color:var(--ink-faint);
  margin-top:10px;line-height:1.5;
}
.field-checkbox{display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-size:.8rem}

/* ---------- Empty state ---------- */
.empty-state{text-align:center;padding:60px 20px;color:var(--ink-faint)}
.empty-state h3{font-size:1.05rem;font-weight:700;color:var(--ink-soft);margin-bottom:8px;letter-spacing:-.01em}
.empty-state p{font-size:.86rem;line-height:1.6}

/* ---------- Toast ---------- */
.toast{
  position:fixed;bottom:22px;right:22px;
  background:var(--ink);color:#fff;
  padding:11px 18px;border-radius:10px;
  border-left:3px solid var(--gold);
  box-shadow:var(--shadow-lg);z-index:200;
  font-size:.84rem;font-weight:500;
  opacity:0;transition:opacity .2s,transform .2s;
  transform:translateY(10px);pointer-events:none;
}
.toast.show{opacity:1;transform:translateY(0)}

/* ---------- Form grid (portfolio modal) ---------- */
.form-grid label{
  display:block;
  font-family:'IBM Plex Mono',monospace!important;
  font-size:.62rem!important;font-weight:600!important;
  color:var(--ink-faint)!important;
  text-transform:uppercase!important;letter-spacing:.1em!important;
}
.form-grid input,.form-grid textarea{
  border:1px solid var(--line)!important;border-radius:8px!important;
  font-family:inherit!important;
}
.form-grid input:focus,.form-grid textarea:focus{
  outline:2px solid var(--gold)!important;outline-offset:1px!important;
  border-color:var(--gold)!important;box-shadow:none!important;
}

/* Scrollbars */
*{scrollbar-width:thin;scrollbar-color:var(--ink-faint) transparent}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:var(--ink-faint)}

@media(max-width:900px){
  .portfolio-meta{grid-template-columns:1fr}
  .tap-grid,.tap-grid.cols-2{grid-template-columns:1fr}
  .sizing-criteria{grid-template-columns:1fr}
  .sizing-result{grid-template-columns:1fr}
  main{padding:14px}
  header,.toolbar{padding-left:14px;padding-right:14px}
}

</style>
</head>

<script>
// ============================================================
// STATE
// ============================================================
let state = { projects: [], portfolios: [], flags: [] };
let currentProjectId = null;
let currentPhaseId = null;
let currentPortfolioId = null;
let currentAssignProjectId = null;
let colWidths = {};
let expandedProjects = new Set();
let collapsedPortfolios = new Set();
let undoStack = [];
const UNDO_LIMIT = 50;

const STORAGE_KEY = 'roadmap-empresas-sj';
const COLS_KEY = 'roadmap-empresas-sj-cols';
const EXPANDED_KEY = 'roadmap-empresas-sj-expanded';
const COLLAPSED_PT_KEY = 'roadmap-empresas-sj-collapsed-portfolios';

function uid() { return Math.random().toString(36).slice(2, 10); }
function save() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e) {} }
function load() {
  try { const s = localStorage.getItem(STORAGE_KEY); if (s) state = JSON.parse(s); }
  catch(e) {}
  try { const c = localStorage.getItem(COLS_KEY); if (c) colWidths = JSON.parse(c); }
  catch(e) {}
  try {
    const ex = localStorage.getItem(EXPANDED_KEY);
    if (ex) expandedProjects = new Set(JSON.parse(ex));
  } catch(e) {}
  try {
    const cp = localStorage.getItem(COLLAPSED_PT_KEY);
    if (cp) collapsedPortfolios = new Set(JSON.parse(cp));
  } catch(e) {}
  // Ensure new fields exist on legacy data
  if (!state.portfolios) state.portfolios = [];
  if (!state.flags) state.flags = [];
  if (!state.projects) state.projects = [];
}
function saveCols() { try { localStorage.setItem(COLS_KEY, JSON.stringify(colWidths)); } catch(e) {} }
function saveExpanded() {
  try { localStorage.setItem(EXPANDED_KEY, JSON.stringify(Array.from(expandedProjects))); }
  catch(e) {}
}
function saveCollapsedPortfolios() {
  try { localStorage.setItem(COLLAPSED_PT_KEY, JSON.stringify(Array.from(collapsedPortfolios))); }
  catch(e) {}
}

// ============================================================
// UNDO
// ============================================================
function snapshot() {
  try {
    undoStack.push(JSON.stringify(state));
    if (undoStack.length > UNDO_LIMIT) undoStack.shift();
    updateUndoButton();
  } catch(e) {}
}
let snapshotDebounceTimer;
function snapshotDebounced() {
  clearTimeout(snapshotDebounceTimer);
  snapshotDebounceTimer = setTimeout(snapshot, 700);
}
function undo() {
  if (!undoStack.length) {
    toast('Nada a desfazer');
    return;
  }
  const prev = undoStack.pop();
  try {
    state = JSON.parse(prev);
    save();
    render();
    updateUndoButton();
    toast('Desfeito ↶');
  } catch(e) {
    toast('Falha ao desfazer');
  }
}
function updateUndoButton() {
  const btn = document.getElementById('btn-undo');
  if (!btn) return;
  btn.disabled = !undoStack.length;
  btn.style.opacity = undoStack.length ? '1' : '0.4';
}

function toggleProjectExpansion(pid) {
  const row = document.querySelector(`.project-row[data-project="${pid}"]`);
  if (!row) return;
  if (expandedProjects.has(pid)) {
    expandedProjects.delete(pid);
    row.classList.remove('expanded');
    const btn = row.querySelector('.proj-toggle');
    if (btn) btn.title = 'Expandir detalhes';
  } else {
    expandedProjects.add(pid);
    row.classList.add('expanded');
    const btn = row.querySelector('.proj-toggle');
    if (btn) btn.title = 'Recolher detalhes';
    row.querySelectorAll('textarea').forEach(autoGrow);
  }
  saveExpanded();
}

function togglePortfolio(portId) {
  if (collapsedPortfolios.has(portId)) collapsedPortfolios.delete(portId);
  else collapsedPortfolios.add(portId);
  saveCollapsedPortfolios();
  const block = document.querySelector(`.portfolio-block[data-portfolio="${portId}"]`);
  if (block) block.classList.toggle('collapsed', collapsedPortfolios.has(portId));
}
const PROGRESS_OPTIONS = [0, 25, 50, 75, 100];

// ============================================================
// SEED
// ============================================================
function defaultFlags() {
  return [
    { id: 'flag-dev',    name: 'Início Dev.',  icon: '🚀', color: '#ffc107' },
    { id: 'flag-golive', name: 'Go-Live',      icon: '🎯', color: '#22c55e' },
    { id: 'flag-block',  name: 'Bloqueio',     icon: '🔒', color: '#ef4444' },
    { id: 'flag-risk',   name: 'Atenção',      icon: '⚠️', color: '#f59e0b' },
    { id: 'flag-budget', name: 'Aprovação',    icon: '💰', color: '#0ea5e9' }
  ];
}

function migrateData() {
  // Ensure flags
  if (!state.flags || !state.flags.length) state.flags = defaultFlags();
  // Ensure dev flag exists for migration purposes
  if (!state.flags.find(f => f.id === 'flag-dev')) {
    state.flags.unshift({ id: 'flag-dev', name: 'Início Dev.', icon: '🚀', color: '#ffc107' });
  }
  if (!state.portfolios) state.portfolios = [];
  // Strip programs from portfolios (no longer used)
  state.portfolios.forEach(pt => { delete pt.programs; });
  // Migrate phases: isDevelopmentStart -> flagIds includes 'flag-dev'
  (state.projects || []).forEach(p => {
    if (!('portfolioId' in p)) p.portfolioId = null;
    // Remove programId from projects (no longer used)
    delete p.programId;
    // Ensure TAP object
    if (!p.tap) p.tap = {};
    const t = p.tap;
    if (!('manager' in t)) t.manager = '';
    if (!('startDate' in t)) t.startDate = '';
    if (!('horizon' in t)) t.horizon = '';
    if (!('version' in t)) t.version = '1.0';
    if (!('context' in t)) t.context = '';
    if (!('objective' in t)) t.objective = '';
    if (!('scopeIncluded' in t)) t.scopeIncluded = '';
    if (!('scopeExcluded' in t)) t.scopeExcluded = '';

    if (!Array.isArray(t.risks)) t.risks = [];
    if (!('effort' in t)) t.effort = '';
    if (!('dependencies' in t)) t.dependencies = '';
    (p.phases || []).forEach(ph => {
      if (!Array.isArray(ph.flagIds)) ph.flagIds = [];
      if (ph.isDevelopmentStart && !ph.flagIds.includes('flag-dev')) {

      }
      delete ph.isDevelopmentStart;

      });
    });
  });
}

// ============================================================
// DATE HELPERS
// ============================================================
function parseDate(s) {
  if (!s) return null;
  if (s instanceof Date) return isNaN(s) ? null : s;
  const d = new Date(s + 'T00:00:00');
  return isNaN(d) ? null : d;
}
function fmtMonth(d) {
  const m = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
  return m[d.getMonth()];
}
function addMonths(d, n) { const r = new Date(d); r.setMonth(r.getMonth() + n); return r; }
function monthsBetween(a, b) {
  return (b.getFullYear() - a.getFullYear()) * 12 + (b.getMonth() - a.getMonth());
}
function durationDays(start, end) {
  const s = parseDate(start), e = parseDate(end);
  if (!s || !e) return 1;
  return Math.max(1, (e - s) / 86400000 + 1);
}

function getTimeRange() {
  const dates = [];
  state.projects.forEach(p => (p.phases||[]).forEach(ph => {
    ['plannedStart','plannedEnd','replannedStart','replannedEnd','actualStart','actualEnd']
      .forEach(k => { const d = parseDate(ph[k]); if (d) dates.push(d); });
  }));
  if (!dates.length) {
    const now = new Date();
    const start = new Date(now.getFullYear(), now.getMonth(), 1);
    return { start, end: addMonths(start, 12) };
  }
  const minD = new Date(Math.min(...dates));
  const maxD = new Date(Math.max(...dates));
  const start = new Date(minD.getFullYear(), minD.getMonth() - 1, 1);
  const end = new Date(maxD.getFullYear(), maxD.getMonth() + 2, 1);
  return { start, end };
}
function dateToPercent(d, range) {
  const total = range.end - range.start;
  return Math.max(0, Math.min(100, ((d - range.start) / total) * 100));
}

// ============================================================
// PROGRESS COMPUTATION
// ============================================================
function phasePredictedProgress(phase, today) {
  today = today || new Date();
  const start = parseDate(phase.replannedStart || phase.plannedStart);
  const end = parseDate(phase.replannedEnd || phase.plannedEnd);
  if (!start || !end) return 0;
  if (end.getTime() === start.getTime()) {
    return today >= start ? 100 : 0;
  }
  if (today < start) return 0;
  if (today > end) return 100;
  return Math.round(((today - start) / (end - start)) * 100);
}

function phaseRealizedProgress(phase) {
  if (phase.tasks && phase.tasks.length) {
    let totalWeight = 0, weighted = 0;
    phase.tasks.forEach(t => {
      const w = durationDays(
        t.replannedStart || t.plannedStart || t.actualStart,
        t.replannedEnd || t.plannedEnd || t.actualEnd
      );
      const p = Number(t.progress) || 0;
      weighted += w * p;
      totalWeight += w;
    });
    return totalWeight ? Math.round(weighted / totalWeight) : 0;
  }
  return Number(phase.progress) || 0;
}

function projectProgress(project) {
  const phases = (project.phases || []).filter(ph => !ph.isMilestone);
  if (!phases.length) return { predicted: 0, realized: 0 };
  const today = new Date();
  let pW = 0, pSum = 0, rW = 0, rSum = 0;
  phases.forEach(ph => {
    const dur = durationDays(
      ph.replannedStart || ph.plannedStart,
      ph.replannedEnd || ph.plannedEnd
    );
    pSum += dur * phasePredictedProgress(ph, today);
    pW += dur;
    rSum += dur * phaseRealizedProgress(ph);
    rW += dur;
  });
  return {
    predicted: pW ? Math.round(pSum / pW) : 0,
    realized: rW ? Math.round(rSum / rW) : 0
  };
}

function escapeHtml(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function render() {
  const wrap = document.getElementById('timeline-wrap');
  const hasAny = (state.projects && state.projects.length) || (state.portfolios && state.portfolios.length);
  if (!hasAny) {
    wrap.innerHTML = `<div class="empty-state">
      <h3>Nenhum projeto ou portfólio cadastrado</h3>
      <p>Comece criando um <strong>📁 Novo Portfólio</strong> ou um <strong>➕ Novo Projeto</strong>, ou carregue uma planilha existente.</p>
    </div>`;
    updateUndoButton();
    return;
  }

  const range = getTimeRange();
  const totalMonths = Math.max(1, monthsBetween(range.start, range.end));
  const monthMarks = [];
  const yearGroups = [];
  let curYear = null, curYearStart = 0;
  for (let i = 0; i < totalMonths; i++) {
    const d = addMonths(range.start, i);
    monthMarks.push(`<div class="month-mark">${fmtMonth(d)}</div>`);
    if (curYear !== d.getFullYear()) {
      if (curYear !== null) yearGroups.push({ year: curYear, span: i - curYearStart });
      curYear = d.getFullYear();
      curYearStart = i;
    }
  }
  if (curYear !== null) yearGroups.push({ year: curYear, span: totalMonths - curYearStart });
  const yearsHtml = yearGroups.map(g =>
    `<div class="year-mark" style="flex:${g.span}">${g.year}</div>`).join('');

  let html = `
    <div class="year-row">
      <div class="col-info"></div>
      <div class="years">${yearsHtml}</div>
    </div>
    <div class="timeline-header">
      <div class="col-info">Projeto</div>
      <div class="col-timeline">
        <div class="month-marks">${monthMarks.join('')}</div>
      </div>
    </div>
  `;

  // Group projects by portfolio
  const byPortfolio = new Map();
  const ungrouped = [];
  state.projects.forEach(p => {
    const pid = p.portfolioId;
    if (pid && state.portfolios.find(pt => pt.id === pid)) {
      if (!byPortfolio.has(pid)) byPortfolio.set(pid, []);
      byPortfolio.get(pid).push(p);
    } else {
      ungrouped.push(p);
    }
  });

  // Render each portfolio
  state.portfolios.forEach(portfolio => {
    const projects = byPortfolio.get(portfolio.id) || [];
    html += renderPortfolioBlock(portfolio, projects, range);
  });

  // Render ungrouped section
  if (ungrouped.length) {
    html += `<div class="ungrouped-header">Sem Portfólio · ${ungrouped.length} projeto${ungrouped.length>1?'s':''}</div>`;
    ungrouped.forEach(p => { html += renderProjectRow(p, range); });
  }

  wrap.innerHTML = html;
  wrap.querySelectorAll('textarea.editable').forEach(autoGrow);
  updateUndoButton();
}

function getFlag(flagId) {
  return (state.flags || []).find(f => f.id === flagId);
}

function renderBars(p, range) {
  const bars = [];
  (p.phases||[]).forEach(ph => {
    const flagIds = ph.flagIds || [];
    const flags = flagIds.map(getFlag).filter(Boolean);
    const flagIcons = flags.map(f => `<span class="bar-flag" title="${escapeHtml(f.name)}">${f.icon||'🏷'}</span>`).join('');
    const flagNamesForTitle = flags.length ? `\nFlags: ${flags.map(f=>f.name).join(', ')}` : '';

    if (ph.isMilestone) {
      const d = parseDate(ph.actualStart) || parseDate(ph.replannedStart) || parseDate(ph.plannedStart);
      if (!d) return;
      const pos = dateToPercent(d, range);
      const title = `${ph.name} (Marco)${flagNamesForTitle}\n` +
        (ph.plannedStart ? `Planejado: ${ph.plannedStart}\n` : '') +
        (ph.replannedStart ? `Replanejado: ${ph.replannedStart}\n` : '') +
        (ph.actualStart ? `Realizado: ${ph.actualStart}` : '');
      bars.push(`<div class="milestone" style="left:${pos}%"
        data-project="${p.id}" data-phase="${ph.id}" title="${escapeHtml(title)}"></div>`);
    } else {
      const useStart = parseDate(ph.actualStart) || parseDate(ph.replannedStart) || parseDate(ph.plannedStart);
      const useEnd = parseDate(ph.actualEnd) || parseDate(ph.replannedEnd) || parseDate(ph.plannedEnd);
      if (!useStart || !useEnd) return;
      const left = dateToPercent(useStart, range);
      const right = dateToPercent(useEnd, range);
      const width = Math.max(right - left, 0.8);

      let cls = 'phase-bar';
      if (parseDate(ph.actualStart) || parseDate(ph.actualEnd)) cls += ' actual';
      else if (parseDate(ph.replannedStart) || parseDate(ph.replannedEnd)) cls += ' replanned';
      // If phase has the "dev" flag, apply the dev-start visual
      if (flagIds.includes('flag-dev')) cls += ' dev-start';

      const rp = phaseRealizedProgress(ph);
      const title = `${ph.name} (${rp}%)${flagNamesForTitle}\n` +
        `Planejado: ${ph.plannedStart||'?'} → ${ph.plannedEnd||'?'}` +
        (ph.replannedStart||ph.replannedEnd ? `\nReplanejado: ${ph.replannedStart||'?'} → ${ph.replannedEnd||'?'}` : '') +
        (ph.actualStart||ph.actualEnd ? `\nRealizado: ${ph.actualStart||'?'} → ${ph.actualEnd||'em curso'}` : '');

      bars.push(`<div class="${cls}" style="left:${left}%;width:${width}%"
        data-project="${p.id}" data-phase="${ph.id}"
        title="${escapeHtml(title)}">${flagIcons}${escapeHtml(ph.name)}</div>`);
    }
  });
  return bars.join('');
}

function newProject() {
  const p = {
    id: uid(),
    name: 'Novo Projeto', company: '', businessCapabilities: '', technology: '',
    sponsor: '', status: 'green', statusExplanation: '', phases: []
  };
  state.projects.push(p);
  migrateData(); // ensures tap object is initialized
  expandedProjects.add(p.id);
  saveExpanded();
  save();
  render();
  toast('Projeto criado — preencha os campos');
  setTimeout(() => {
    const input = document.querySelector(`input[data-pid="${p.id}"][data-field="name"]`);
    if (input) { input.focus(); input.select(); }
  }, 50);
}

function deleteProject(pid) {
  if (!confirm('Excluir este projeto e todas as suas fases e tarefas?')) return;
  state.projects = state.projects.filter(p => p.id !== pid);
  expandedProjects.delete(pid);
  saveExpanded();
  save(); render();
  toast('Projeto excluído');
}

function cycleStatus(pid) {
  const p = state.projects.find(x => x.id === pid);
  if (!p) return;
  const order = ['green', 'yellow', 'red'];
  const i = order.indexOf(p.status);
  p.status = order[(i + 1) % order.length];
  save();
  const labels = { green: 'Verde', yellow: 'Amarelo', red: 'Vermelho' };
  const row = document.querySelector(`.project-row[data-project="${pid}"]`);
  if (!row) return;
  const pill = row.querySelector('.status-pill');
  if (pill) {
    pill.classList.remove('green','yellow','red','gray');
    pill.classList.add(p.status);
    // rebuild label text while keeping the dot span
    pill.innerHTML = `<span class="dot"></span>${labels[p.status]}`;
  }
  const reason = row.querySelector('.farol-reason');
  if (reason) {
    reason.classList.remove('green','yellow','red');
    reason.classList.add(p.status);
    const lbl = reason.querySelector('.farol-label');
    if (lbl) lbl.innerHTML = `<span class="marker"></span>Motivo do farol (${labels[p.status]})`;
  }
}

function onInlineEdit(el) {
  const pid = el.dataset.pid;
  const field = el.dataset.field;
  if (!pid || !field) return;
  const p = state.projects.find(x => x.id === pid);
  if (!p) return;
  p[field] = el.value;
  save();
  if (el.tagName === 'TEXTAREA') autoGrow(el);
}

// ============================================================
// COLUMN RESIZERS
// ============================================================
function setupColumnResizers(tableId) {
  try {
    const table = document.getElementById(tableId);
    if (!table) return;
    const cols = table.querySelectorAll('colgroup col');
    const headerRows = table.querySelectorAll('thead tr');
    if (!headerRows.length) return;

    const thByCol = {};
    let topRowColIdx = 0;
    headerRows[0].querySelectorAll('th').forEach(th => {
      const colspan = parseInt(th.getAttribute('colspan') || '1');
      const rowspan = parseInt(th.getAttribute('rowspan') || '1');
      if (rowspan > 1 || colspan === 1) {
        if (colspan === 1) thByCol[topRowColIdx] = th;
        topRowColIdx += colspan;
      } else {
        topRowColIdx += colspan;
      }
    });
    if (headerRows[1]) {
      const filledByTop = new Set();
      let acc = 0;
      headerRows[0].querySelectorAll('th').forEach(th => {
        const colspan = parseInt(th.getAttribute('colspan') || '1');
        const rowspan = parseInt(th.getAttribute('rowspan') || '1');
        if (rowspan > 1) {
          for (let k = 0; k < colspan; k++) filledByTop.add(acc + k);
        }
        acc += colspan;
      });
      const bottomThs = headerRows[1].querySelectorAll('th');
      let btIdx = 0;
      for (let colIdx = 0; colIdx < cols.length; colIdx++) {
        if (filledByTop.has(colIdx)) continue;
        if (bottomThs[btIdx]) thByCol[colIdx] = bottomThs[btIdx];
        btIdx++;
      }
    }

    cols.forEach((col, i) => {
      const th = thByCol[i];
      if (!th) return;
      if (th.querySelector('.col-resizer')) return;
      const resizer = document.createElement('div');
      resizer.className = 'col-resizer';
      th.appendChild(resizer);
      resizer.addEventListener('mousedown', e => {
        e.preventDefault();
        e.stopPropagation();
        const startX = e.pageX;
        const startW = col.offsetWidth || parseFloat(getComputedStyle(col).width) || 100;
        const minW = parseInt(col.dataset.min || '50');
        resizer.classList.add('active');
        document.body.classList.add('resizing');
        const onMove = e2 => {
          const newW = Math.max(minW, startW + (e2.pageX - startX));
          col.style.width = newW + 'px';
        };
        const onUp = () => {
          document.removeEventListener('mousemove', onMove);
          document.removeEventListener('mouseup', onUp);
          resizer.classList.remove('active');
          document.body.classList.remove('resizing');
          if (!colWidths[tableId]) colWidths[tableId] = {};
          colWidths[tableId][i] = col.offsetWidth;
          saveCols();
        };
        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onUp);
      });
    });
  } catch (err) {
    console.warn('Falha ao configurar redimensionamento de colunas:', err);
  }
}

function applyColumnWidths(tableId) {
  const widths = colWidths[tableId];
  if (!widths) return;
  const table = document.getElementById(tableId);
  if (!table) return;
  const cols = table.querySelectorAll('colgroup col');
  Object.entries(widths).forEach(([i, w]) => {
    if (cols[i]) cols[i].style.width = w + 'px';
  });
}

function openFlagChooser(btn, targetId, kind) {
  closeFlagPopup();
  // Find target object
  let target = findFlagTarget(targetId, kind);
  if (!target) return;
  const usedIds = new Set(target.flagIds || []);
  const available = (state.flags || []).filter(f => !usedIds.has(f.id));

  const popup = document.createElement('div');
  popup.className = 'flag-popup';
  if (available.length) {
    popup.innerHTML = available.map(f => `
      <div class="popup-option" data-flag-pick="${f.id}">
        <span class="swatch" style="background:${f.color}"></span>
        <span>${f.icon||'🏷'}</span>
        <span>${escapeHtml(f.name)}</span>
      </div>
    `).join('') + `
      <div style="border-top:1px solid var(--border);margin-top:4px;padding-top:4px">
        <div class="popup-option" data-manage-flags-link>
          <span>🚩</span><span>Gerenciar flags…</span>
        </div>
      </div>`;
  } else {
    popup.innerHTML = `<div class="popup-empty">Todas as flags já foram adicionadas</div>
      <div style="border-top:1px solid var(--border);margin-top:4px;padding-top:4px">
        <div class="popup-option" data-manage-flags-link>
          <span>🚩</span><span>Gerenciar flags…</span>
        </div>
      </div>`;
  }
  document.body.appendChild(popup);
  // Position
  const r = btn.getBoundingClientRect();
  popup.style.left = (r.left + window.scrollX) + 'px';
  popup.style.top  = (r.bottom + window.scrollY + 2) + 'px';
  activeFlagPopup = popup;
  popup.dataset.target = targetId;
  popup.dataset.kind = kind;
}

function findFlagTarget(id, kind) {
  // Search all phases & tasks across all projects
  for (const p of state.projects) {
    for (const ph of (p.phases||[])) {
      if (kind === 'phase' && ph.id === id) return ph;
      if (kind === 'task') {
        const t = (ph.tasks||[]).find(x => x.id === id);
        if (t) return t;
      }
    }
  }
  return null;
}

function addFlagToTarget(targetId, kind, flagId) {
  const t = findFlagTarget(targetId, kind);
  if (!t) return;
  if (!Array.isArray(t.flagIds)) t.flagIds = [];
  if (!t.flagIds.includes(flagId)) {
    snapshot();
    t.flagIds.push(flagId);
    save();
    if (document.getElementById('phases-modal').classList.contains('open')) renderPhasesModal();
    if (document.getElementById('tasks-modal').classList.contains('open')) renderTasksModal();
    render();
  }
}
function removeFlagFromTarget(targetId, kind, flagId) {
  const t = findFlagTarget(targetId, kind);
  if (!t || !Array.isArray(t.flagIds)) return;
  snapshot();
  t.flagIds = t.flagIds.filter(id => id !== flagId);
  save();
  if (document.getElementById('phases-modal').classList.contains('open')) renderPhasesModal();
  if (document.getElementById('tasks-modal').classList.contains('open')) renderTasksModal();
  render();
}

function deleteFlag(flagId) {
  if (!confirm('Excluir esta flag? Ela será removida de todas as fases e tarefas que a usam.')) return;
  snapshot();
  state.flags = state.flags.filter(f => f.id !== flagId);
  state.projects.forEach(p => (p.phases||[]).forEach(ph => {
    if (Array.isArray(ph.flagIds)) ph.flagIds = ph.flagIds.filter(id => id !== flagId);
    (ph.tasks||[]).forEach(t => {
      if (Array.isArray(t.flagIds)) t.flagIds = t.flagIds.filter(id => id !== flagId);
    });
  }));
  save();
  renderFlagsModal();
  render();
  toast('Flag excluída');
}

function deletePortfolio(portId) {
  const port = state.portfolios.find(p => p.id === portId);
  if (!port) return;
  if (!confirm(`Excluir o portfólio "${port.name}"? Os projetos vinculados serão desvinculados (não excluídos).`)) return;
  snapshot();
  state.portfolios = state.portfolios.filter(p => p.id !== portId);
  state.projects.forEach(p => {
    if (p.portfolioId === portId) p.portfolioId = null;
  });
  save();
  render();
  toast('Portfólio excluído');
}

const SIZING_EFFORT = [
  { code: 'E1', label: 'E1 — até 1 semana' },
  { code: 'E2', label: 'E2 — até 4 semanas' },
  { code: 'E3', label: 'E3 — 4 a 12 semanas' },
  { code: 'E4', label: 'E4 — mais de 12 semanas' }
];
const SIZING_DEPS = [
  { code: 'D0', label: 'D0 — nenhuma (time resolve sozinho)' },
  { code: 'D1', label: 'D1 — 1 dependência interna simples' },
  { code: 'D2', label: 'D2 — 2 a 3 dependências, ou 1 externa' },
  { code: 'D3', label: 'D3 — mais de 3, múltiplos times/janelas' }
];
// Matrix from the methodology image
const SIZING_MATRIX = {
  E1: { D0:'P',  D1:'P',  D2:'M',  D3:'M'  },
  E2: { D0:'P',  D1:'P',  D2:'M',  D3:'G'  },
  E3: { D0:'M',  D1:'M',  D2:'G',  D3:'EG' },
  E4: { D0:'EG', D1:'EG', D2:'EG', D3:'EG' }
};
const SIZE_LABELS = { P:'Pequeno', M:'Médio', G:'Grande', EG:'Extra Grande' };

function computeSize(effort, deps) {
  if (!effort || !deps) return null;
  return (SIZING_MATRIX[effort] || {})[deps] || null;
}

function openTapModal(projectId) {

function renderRiskRow(r, idx) {
  return `
    <tr data-risk="${idx}">
      <td><textarea class="rk-risk" rows="1" placeholder="Descrição do risco">${escapeHtml(r.risk||'')}</textarea></td>
      <td>
        <select class="rk-impact">

          <option value="Baixo" ${r.impact==='Baixo'?'selected':''}>Baixo</option>
        </select>
      </td>
      <td>
        <select class="rk-prob">
          <option value="">—</option>
          <option value="Alta" ${r.probability==='Alta'?'selected':''}>Alta</option>
          <option value="Média" ${r.probability==='Média'?'selected':''}>Média</option>
          <option value="Baixa" ${r.probability==='Baixa'?'selected':''}>Baixa</option>
        </select>
      </td>
      <td><textarea class="rk-mit" rows="1" placeholder="Como mitigar">${escapeHtml(r.mitigation||'')}</textarea></td>
      <td style="text-align:center"><button class="icon-btn del" data-del-risk="${idx}" title="Excluir risco">🗑</button></td>
    </tr>
  `;
}

function wireTapFields() {
  const p = state.projects.find(x => x.id === currentProjectId);
  if (!p) return;
  const t = p.tap;

  // Inline edit handlers for TAP fields
  document.querySelectorAll('#tap-body [data-tap]').forEach(el => {
    const field = el.dataset.tap;
    const handler = (e) => {
      snapshotDebounced();
      const val = e.target.value;
      if (field.startsWith('_')) {
        // Direct project field (name, sponsor, company, etc.)
        const projField = field.slice(1);
        p[projField] = val;
      } else {
        // TAP subfield
        t[field] = val;
      }
      save();
      // For size selectors, re-render to update matrix highlight + pill
      if (field === 'effort' || field === 'dependencies') {
        renderTapModal();
      }
      // For name change, update modal title
      if (field === '_name') {
        const title = document.getElementById('tap-title');
        if (title) title.textContent = `📑 Cadastro · ${val || 'Projeto'}`;
      }
      render(); // refresh main view
    };
    if (el.tagName === 'SELECT' || el.type === 'date') {
      el.onchange = handler;
    } else {
      el.oninput = handler;
      if (el.tagName === 'TEXTAREA') {
        el.addEventListener('input', () => autoGrow(el));
      }
    }
  });

  // Add risk button
  const btnAddRisk = document.getElementById('btn-add-risk');
  if (btnAddRisk) {
    btnAddRisk.onclick = () => {
      snapshot();
      if (!Array.isArray(t.risks)) t.risks = [];
      t.risks.push({ risk:'', impact:'', probability:'', mitigation:'' });
      save();
      renderTapModal();
    };
  }

  // Risk row inputs
  document.querySelectorAll('#risks-tbody tr[data-risk]').forEach(row => {
    const idx = Number(row.dataset.risk);
    const r = t.risks[idx];
    if (!r) return;
    row.querySelector('.rk-risk').oninput = e => { r.risk = e.target.value; autoGrow(e.target); snapshotDebounced(); save(); };
    row.querySelector('.rk-mit').oninput = e => { r.mitigation = e.target.value; autoGrow(e.target); snapshotDebounced(); save(); };
    row.querySelector('.rk-impact').onchange = e => { snapshot(); r.impact = e.target.value; save(); };
    row.querySelector('.rk-prob').onchange = e => { snapshot(); r.probability = e.target.value; save(); };
  });
}

function deleteRisk(idx) {
  const p = state.projects.find(x => x.id === currentProjectId);
  if (!p || !p.tap || !Array.isArray(p.tap.risks)) return;
  snapshot();
  p.tap.risks.splice(idx, 1);
  save();
  renderTapModal();
}

function downloadXLSX() {
  const wb = XLSX.utils.book_new();

  // Helper: lookup names
  const portfolioName = id => (state.portfolios.find(p => p.id === id)||{}).name || '';
  const flagNames = ids => (ids||[]).map(id => {
    const f = state.flags.find(x => x.id === id);
    return f ? f.name : id;
  }).join('; ');

  // --- PORTFÓLIOS sheet ---
  const portRows = state.portfolios.map(pt => ({
    'ID Portfólio': pt.id,
    'Nome': pt.name,
    'Justificativa': pt.justification || '',
    'Metas': pt.goals || ''
  }));
  if (!portRows.length) portRows.push({'ID Portfólio':'','Nome':'','Justificativa':'','Metas':''});
  const wsP = XLSX.utils.json_to_sheet(portRows);
  wsP['!cols'] = [{wch:14},{wch:30},{wch:60},{wch:60}];
  XLSX.utils.book_append_sheet(wb, wsP, 'Portfólios');

  // --- FLAGS sheet ---
  const flagRows = (state.flags||[]).map(f => ({
    'ID Flag': f.id,
    'Nome': f.name,
    'Ícone': f.icon || '',
    'Cor (hex)': f.color || ''
  }));
  if (!flagRows.length) flagRows.push({'ID Flag':'','Nome':'','Ícone':'','Cor (hex)':''});
  const wsF = XLSX.utils.json_to_sheet(flagRows);
  wsF['!cols'] = [{wch:14},{wch:20},{wch:8},{wch:12}];
  XLSX.utils.book_append_sheet(wb, wsF, 'Flags');

  // --- PROJETOS sheet ---
  const projectRows = state.projects.map(p => {

function normalizeDate(v) {
  if (v === null || v === undefined || v === '') return '';
  if (v instanceof Date) { if (isNaN(v)) return ''; return v.toISOString().slice(0,10); }
  if (typeof v === 'number') {
    const epoch = new Date(Date.UTC(1899, 11, 30));
    const d = new Date(epoch.getTime() + v * 86400000);
    return d.toISOString().slice(0,10);
  }
  if (typeof v === 'string') {
    if (/^\d{4}-\d{2}-\d{2}/.test(v)) return v.slice(0,10);
    const m = v.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
    if (m) return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
    const d = new Date(v);
    if (!isNaN(d)) return d.toISOString().slice(0,10);
    return '';
  }
  return '';
}

function normalizeStatus(s) {
  s = String(s||'').toLowerCase().trim();
  if (['verde','green','g','🟢'].includes(s)) return 'green';
  if (['amarelo','yellow','y','amber','🟡'].includes(s)) return 'yellow';
  if (['vermelho','red','r','🔴'].includes(s)) return 'red';
  return 'green';
}

function normalizeProgress(v) {
  if (v === null || v === undefined || v === '') return 0;
  let n = Number(String(v).replace('%','').trim());
  if (isNaN(n)) return 0;
  if (n > 100) n = 100; if (n < 0) n = 0;
  // snap to nearest of 0/25/50/75/100
  return PROGRESS_OPTIONS.reduce((p, c) => Math.abs(c - n) < Math.abs(p - n) ? c : p, 0);
}

function uploadXLSX(file) {
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = new Uint8Array(e.target.result);
      const wb = XLSX.read(data, { type:'array', cellDates:true });

      const projSheet = wb.Sheets['Projetos'];
      if (!projSheet) throw new Error('Aba "Projetos" não encontrada');

      snapshot();

      const projRows  = XLSX.utils.sheet_to_json(projSheet, { defval:'' });
      const phaseRows = wb.Sheets['Fases']      ? XLSX.utils.sheet_to_json(wb.Sheets['Fases'],      { defval:'' }) : [];
      const taskRows  = wb.Sheets['Tarefas']    ? XLSX.utils.sheet_to_json(wb.Sheets['Tarefas'],    { defval:'' }) : [];
      const portRows  = wb.Sheets['Portfólios'] ? XLSX.utils.sheet_to_json(wb.Sheets['Portfólios'], { defval:'' }) : [];
      const flagRows  = wb.Sheets['Flags']      ? XLSX.utils.sheet_to_json(wb.Sheets['Flags'],      { defval:'' }) : [];

      // PORTFOLIOS
      const portMap = {};
      const newPortfolios = [];
      portRows.forEach(r => {
        if (!r['Nome'] && !r['ID Portfólio']) return;
        const id = String(r['ID Portfólio'] || ('port-' + uid()));
        const pt = {
          id,
          name: String(r['Nome']||''),
          justification: String(r['Justificativa']||''),
          goals: String(r['Metas']||'')
        };
        newPortfolios.push(pt);
        portMap[id] = pt;
      });

      // FLAGS
      let newFlags = [];
      if (flagRows.length) {
        newFlags = flagRows.map(r => {
          if (!r['Nome'] && !r['ID Flag']) return null;
          return {
            id: String(r['ID Flag'] || ('flag-' + uid())),
            name: String(r['Nome']||''),
            icon: String(r['Ícone']||'🏷'),
            color: String(r['Cor (hex)']||'#0d2240')
          };
        }).filter(Boolean);
      } else {
        // Keep current flags if no Flags sheet present
        newFlags = state.flags || defaultFlags();
      }
      // Ensure dev flag survives
      if (!newFlags.find(f => f.id === 'flag-dev')) {
        newFlags.unshift({ id:'flag-dev', name:'Início Dev.', icon:'🚀', color:'#ffc107' });
      }

      const tapRowsImp = wb.Sheets['Cadastro (TAP)'] ? XLSX.utils.sheet_to_json(wb.Sheets['Cadastro (TAP)'], { defval:'' }) : [];
      const riskRowsImp = wb.Sheets['Riscos'] ? XLSX.utils.sheet_to_json(wb.Sheets['Riscos'], { defval:'' }) : [];

      // PROJECTS
      const projMap = {};
      const newProjects = [];
      projRows.forEach(r => {
        if (!r['Nome'] && !r['ID Projeto']) return;
        const pid = String(r['ID Projeto'] || uid());
        const p = {
          id: pid,
          name: String(r['Nome']||''),
          portfolioId: String(r['ID Portfólio']||'') || null,
          company: String(r['Empresa']||''),
          businessCapabilities: String(r['Capacidades de Negócio']||r['Capacidades']||''),
          technology: String(r['Tecnologia']||''),
          sponsor: String(r['Patrocinador']||''),
          status: normalizeStatus(r['Farol']),
          statusExplanation: String(r['Justificativa do Farol']||r['Justificativa']||''),
          tap: {
            manager: String(r['Gerente do Projeto']||''),
            startDate: normalizeDate(r['Data Início']),
            horizon: String(r['Horizonte']||''),
            version: String(r['Versão TAP']||'1.0'),
            context: '', objective: '', scopeIncluded: '', scopeExcluded: '',
            assumptions: '', constraints: '', successCriteria: '',
            risks: [],
            effort: String(r['Esforço (E)']||'').trim().toUpperCase(),
            dependencies: String(r['Dependências (D)']||'').trim().toUpperCase()
          },
          phases: []
        };
        // Validate references
        if (p.portfolioId && !portMap[p.portfolioId]) p.portfolioId = null;
        newProjects.push(p);
        projMap[pid] = p;
      });

      // TAP rows (long-form fields)
      tapRowsImp.forEach(r => {
        const pid = String(r['ID Projeto']||'');
        const p = projMap[pid];
        if (!p) return;
        const t = p.tap;
        t.context        = String(r['Contexto e Justificativa']||'');
        t.objective      = String(r['Objetivo']||'');
        t.scopeIncluded  = String(r['Escopo Incluído']||'');
        t.scopeExcluded  = String(r['Escopo Excluído']||'');
        t.assumptions    = String(r['Premissas']||'');
        t.constraints    = String(r['Restrições']||'');
        t.successCriteria= String(r['Critérios de Sucesso']||'');
      });

      // RISKS rows
      riskRowsImp.forEach(r => {
        const pid = String(r['ID Projeto']||'');
        const p = projMap[pid];
        if (!p) return;
        p.tap.risks.push({
          risk: String(r['Risco']||''),
          impact: String(r['Impacto']||''),
          probability: String(r['Probabilidade']||''),
          mitigation: String(r['Mitigador']||'')
        });
      });

      // PHASES
      const phaseMap = {};
      phaseRows.forEach(r => {
        const pid = String(r['ID Projeto']||'');
        if (!projMap[pid]) return;
        const phid = String(r['ID Fase'] || uid());
        // Parse flags: prefer "IDs Flags" (semicolon-separated), else fallback to "Flags" (names)
        let flagIds = [];
        const idsRaw = String(r['IDs Flags']||'').trim();
        if (idsRaw) {
          flagIds = idsRaw.split(/[;,]/).map(s => s.trim()).filter(Boolean);
        } else {
          const namesRaw = String(r['Flags']||'').trim();
          if (namesRaw) {
            const names = namesRaw.split(/[;,]/).map(s => s.trim()).filter(Boolean);
            names.forEach(nm => {
              const f = newFlags.find(x => x.name.toLowerCase() === nm.toLowerCase());
              if (f) flagIds.push(f.id);
            });
          }
        }
        // Backward compat: "Tipo" column
        const tipo = String(r['Tipo']||'').toLowerCase();
        const isMarco = String(r['Marco']||'').toLowerCase().startsWith('s') || tipo.includes('marco') || tipo === 'milestone';
        if (tipo.includes('dev') && !flagIds.includes('flag-dev')) flagIds.push('flag-dev');

        const ph = {
          id: phid,
          name: String(r['Nome da Fase']||''),
          flagIds: flagIds.filter(id => newFlags.find(f => f.id === id)),
          isMilestone: isMarco,
          progress: normalizeProgress(r['Progresso %']),
          plannedStart: normalizeDate(r['Início Planejado']),
          plannedEnd: normalizeDate(r['Fim Planejado']),
          replannedStart: normalizeDate(r['Início Replanejado']),
          replannedEnd: normalizeDate(r['Fim Replanejado']),
          actualStart: normalizeDate(r['Início Realizado']),
          actualEnd: normalizeDate(r['Fim Realizado']),
          tasks: []
        };
        projMap[pid].phases.push(ph);
        phaseMap[phid] = ph;
      });

      // TASKS
      taskRows.forEach(r => {
        const phid = String(r['ID Fase']||'');
        if (!phaseMap[phid]) return;
        let flagIds = [];
        const idsRaw = String(r['IDs Flags']||'').trim();
        if (idsRaw) {
          flagIds = idsRaw.split(/[;,]/).map(s => s.trim()).filter(Boolean);
        } else {
          const namesRaw = String(r['Flags']||'').trim();
          if (namesRaw) {
            const names = namesRaw.split(/[;,]/).map(s => s.trim()).filter(Boolean);
            names.forEach(nm => {
              const f = newFlags.find(x => x.name.toLowerCase() === nm.toLowerCase());
              if (f) flagIds.push(f.id);
            });
          }
        }
        phaseMap[phid].tasks.push({
          id: String(r['ID Tarefa']||uid()),
          name: String(r['Nome da Tarefa']||''),
          flagIds: flagIds.filter(id => newFlags.find(f => f.id === id)),
          progress: normalizeProgress(r['Progresso %']),
          plannedStart: normalizeDate(r['Início Planejado']),
          plannedEnd: normalizeDate(r['Fim Planejado']),
          replannedStart: normalizeDate(r['Início Replanejado']),
          replannedEnd: normalizeDate(r['Fim Replanejado']),
          actualStart: normalizeDate(r['Início Realizado']),
          actualEnd: normalizeDate(r['Fim Realizado'])
        });
      });

      state.projects = newProjects;
      state.portfolios = newPortfolios;
      state.flags = newFlags;
      save();
      render();
      toast(`Planilha carregada: ${newProjects.length} projeto(s), ${newPortfolios.length} portfólio(s)`);
    } catch(err) {
      alert('Erro ao carregar planilha: ' + err.message);
    }
  };
  reader.readAsArrayBuffer(file);
}

let toastTimer;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
}

document.addEventListener('input', e => {
  if (e.target.classList && e.target.classList.contains('editable')) {
    // Snapshot debounced for inline edits (one per ~700ms of editing)
    snapshotDebounced();
    onInlineEdit(e.target);
  }
});

document.addEventListener('click', e => {
  // Modal close
  if (e.target.dataset && e.target.dataset.close) {
    closeFlagPopup();
    closeModal(e.target.dataset.close);
  }
  if (e.target.classList && e.target.classList.contains('modal-backdrop')) {
    closeFlagPopup();
    closeModal(e.target.id);
  }

  // Click outside flag popup → close it
  if (activeFlagPopup && !e.target.closest('.flag-popup') && !e.target.closest('[data-add-flag]')) {
    closeFlagPopup();
  }

  // Status cycle
  const sb = e.target.closest('[data-cycle-status]');
  if (sb) { snapshot(); cycleStatus(sb.dataset.cycleStatus); return; }

  // Toggle project expansion
  const tg = e.target.closest('[data-toggle-project]');
  if (tg) { toggleProjectExpansion(tg.dataset.toggleProject); return; }

  // Toggle portfolio collapse
  const tp = e.target.closest('[data-toggle-portfolio]');
  if (tp) { togglePortfolio(tp.dataset.togglePortfolio); return; }

  // Edit portfolio
  const ep = e.target.closest('[data-edit-portfolio]');
  if (ep) { e.stopPropagation(); openPortfolioModal(ep.dataset.editPortfolio); return; }

  // Delete portfolio
  const dpo = e.target.closest('[data-del-portfolio]');
  if (dpo) { e.stopPropagation(); deletePortfolio(dpo.dataset.delPortfolio); return; }

  // Unassign project from portfolio (within portfolio modal)
  const unA = e.target.closest('[data-unassign-project]');
  if (unA) {
    e.stopPropagation();
    const proj = state.projects.find(x => x.id === unA.dataset.unassignProject);
    if (proj) {
      snapshot();
      proj.portfolioId = null;
      save();
      if (document.getElementById('portfolio-modal').classList.contains('open')) renderPortfolioModal();
      render();
      toast('Projeto desvinculado');
    }
    return;
  }

  // Delete project from portfolio modal
  const delPP = e.target.closest('[data-del-portfolio-project]');
  if (delPP) {
    e.stopPropagation();
    const projId = delPP.dataset.delPortfolioProject;
    const proj = state.projects.find(x => x.id === projId);
    if (proj && confirm(`Excluir o projeto "${proj.name}" definitivamente?`)) {
      snapshot();
      state.projects = state.projects.filter(x => x.id !== projId);
      expandedProjects.delete(projId);
      saveExpanded();
      save();
      if (document.getElementById('portfolio-modal').classList.contains('open')) renderPortfolioModal();
      render();
      toast('Projeto excluído');
    }
    return;
  }

  // Assign project to portfolio/program
  const ap = e.target.closest('[data-assign-project]');
  if (ap) { e.stopPropagation(); openAssignModal(ap.dataset.assignProject); return; }

  // Open TAP / Cadastro modal
  const eTap = e.target.closest('[data-edit-tap]');
  if (eTap) { e.stopPropagation(); openTapModal(eTap.dataset.editTap); return; }

  // Delete risk inside TAP modal
  const dRisk = e.target.closest('[data-del-risk]');
  if (dRisk) { e.stopPropagation(); deleteRisk(Number(dRisk.dataset.delRisk)); return; }

  // Add flag (open chooser)
  const addF = e.target.closest('[data-add-flag]');
  if (addF) {
    e.stopPropagation();
    openFlagChooser(addF, addF.dataset.addFlag, addF.dataset.kind);
    return;
  }

  // Pick flag from popup
  const pickF = e.target.closest('[data-flag-pick]');
  if (pickF && activeFlagPopup) {
    const targetId = activeFlagPopup.dataset.target;
    const kind = activeFlagPopup.dataset.kind;
    addFlagToTarget(targetId, kind, pickF.dataset.flagPick);
    closeFlagPopup();
    return;
  }

  // Manage flags link from popup or shortcut
  const mfLink = e.target.closest('[data-manage-flags-link]');
  if (mfLink) { closeFlagPopup(); openFlagsModal(); return; }

  // Remove flag pill
  const remF = e.target.closest('[data-remove-flag]');
  if (remF) {
    e.stopPropagation();
    removeFlagFromTarget(remF.dataset.target, remF.dataset.kind, remF.dataset.removeFlag);
    return;
  }

  // Delete flag from flags modal
  const delF = e.target.closest('[data-del-flag]');
  if (delF) { e.stopPropagation(); deleteFlag(delF.dataset.delFlag); return; }

  // Manage phases
  const mp = e.target.closest('[data-manage-phases]');
  if (mp) { openPhasesModal(mp.dataset.managePhases); return; }

  // Delete project
  const dp = e.target.closest('[data-del-project]');
  if (dp) {
    e.stopPropagation();
    deleteProject(dp.dataset.delProject);
    return;
  }

  // Delete phase
  const delPh = e.target.closest('[data-del-phase]');
  if (delPh) {
    e.stopPropagation();
    const phId = delPh.dataset.delPhase;
    if (confirm('Excluir esta fase e suas tarefas?')) {
      const p = state.projects.find(x => x.id === currentProjectId);
      if (p) {
        snapshot();
        p.phases = p.phases.filter(x => x.id !== phId);
        save();
        renderPhasesModal();
        render();
        toast('Fase excluída');
      }
    }
    return;
  }

  // Delete task
  const delT = e.target.closest('[data-del-task]');
  if (delT) {
    e.stopPropagation();
    const tId = delT.dataset.delTask;
    if (confirm('Excluir esta tarefa?')) {
      const p = state.projects.find(x => x.id === currentProjectId);
      const ph = p?.phases.find(x => x.id === currentPhaseId);
      if (ph) {
        snapshot();
        ph.tasks = (ph.tasks || []).filter(x => x.id !== tId);
        save();
        renderTasksModal();
        if (document.getElementById('phases-modal').classList.contains('open')) renderPhasesModal();
        updateProjectProgressUI(currentProjectId);
        render();
        toast('Tarefa excluída');
      }
    }
    return;
  }

  // Edit phase tasks
  const editPh = e.target.closest('[data-edit-phase]');
  if (editPh) {
    e.stopPropagation();
    openTasksModal(editPh.dataset.editPhase);
    return;
  }

  // Phase bar click → open phases modal
  const pb = e.target.closest('.phase-bar, .milestone');
  if (pb && pb.dataset.project && pb.dataset.phase) {
    openPhasesModal(pb.dataset.project);
    setTimeout(() => openTasksModal(pb.dataset.phase), 80);
  }
});

document.getElementById('btn-new-project').onclick = newProject;
document.getElementById('btn-new-portfolio').onclick = () => openPortfolioModal(null);
document.getElementById('btn-manage-flags').onclick = openFlagsModal;
document.getElementById('btn-undo').onclick = undo;
document.getElementById('btn-expand-all').onclick = () => {
  state.projects.forEach(p => expandedProjects.add(p.id));
  saveExpanded();
  render();
};
document.getElementById('btn-collapse-all').onclick = () => {
  expandedProjects.clear();
  saveExpanded();
  render();
};
document.getElementById('btn-download').onclick = downloadXLSX;
document.getElementById('upload-file').onchange = e => {
  if (e.target.files[0]) uploadXLSX(e.target.files[0]);
  e.target.value = '';
};
document.getElementById('am-save').onclick = applyAssignment;

document.addEventListener('keydown', e => {
  // Ctrl+Z / Cmd+Z → Undo (but don't hijack typing in inputs unless modifier-only)
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && !e.shiftKey) {
    // Allow native undo inside text inputs/textareas (single char)
    const tag = (e.target.tagName||'').toLowerCase();
    if (tag === 'input' || tag === 'textarea') return; // let browser handle in-field undo
    e.preventDefault();
    undo();
    return;
  }
  if (e.key === 'Escape') {
    closeFlagPopup();
    if (document.getElementById('assign-modal').classList.contains('open')) closeModal('assign-modal');
    else if (document.getElementById('tap-modal').classList.contains('open')) closeModal('tap-modal');
    else if (document.getElementById('tasks-modal').classList.contains('open')) closeModal('tasks-modal');
    else if (document.getElementById('phases-modal').classList.contains('open')) closeModal('phases-modal');
    else if (document.getElementById('flags-modal').classList.contains('open')) closeModal('flags-modal');
    else if (document.getElementById('portfolio-modal').classList.contains('open')) closeModal('portfolio-modal');
  }
});

// Close flag popup on scroll
document.addEventListener('scroll', closeFlagPopup, true);
window.addEventListener('resize', closeFlagPopup);

// ============================================================
// INIT
// ============================================================
load();
seedIfEmpty();
migrateData();
render();
</script>
